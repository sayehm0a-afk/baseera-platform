name: Check Pre-Market Readiness (temporary, one-shot, read-only, zero SAHMK cost)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Commit SHA expected to be running in production"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v4

      - run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Run pre-market readiness check
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: python3 .github/workflows/independent_audit/check_pre_market_readiness.py
