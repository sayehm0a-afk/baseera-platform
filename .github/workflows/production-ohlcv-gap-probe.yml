name: Production OHLCV Gap Probe (one-shot, read-only)

# One-shot diagnostic to root-cause two real gaps identified via
# /admin/market-intelligence/coverage on 2026-08-08:
#
# 1. 15 active stocks with zero PriceBar rows despite the
#    historical_ohlcv ingestion job reporting "success" for all 408
#    symbols. ingest_historical_ohlcv.py treats an empty provider
#    response as a legitimate success (zero rows fetched is not an
#    error -- e.g. a symbol fully caught up already), so "job
#    succeeded" does not imply "bars were written". Root-caused via
#    GET /stocks/{symbol} (DB identity) in run 31274610839 -- the live
#    GET /stocks/{symbol}/quote leg was dropped from this file after
#    that run because SAHMK's live-quote path was down for every
#    symbol on 2026-08-08 (weekend), so it produced no discriminating
#    evidence and would just burn further SAHMK calls on rerun.
#
# 2. The 2 symbols the latest market scan (run 98) skipped.
#    scanner.py's _scan_one() only skips for "stock_not_registered"
#    (impossible here -- both were part of the eligible, price-history
#    scan universe) or "insufficient_data" (both technical_result and
#    fundamental_result came back None from build_analysis_context).
#    Run 98 predates the skipped_symbols_summary column, so the exact
#    per-symbol reason was never persisted; we instead inspect
#    GET /stocks/{symbol}/history (real ingested bar count) and
#    GET /stocks/{symbol}/fundamentals (fundamentals presence) to
#    determine which precondition was unmet.
#
# Read-only throughout: never triggers ingestion or a scan. Intended
# to be deleted once its evidence has been captured and root-caused;
# not a durable recurring tool.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend
  SKIPPED_SYMBOLS: "9300 9655"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Checkout (for the print_bar_summary.py helper script)
        uses: actions/checkout@v4

      - name: Fail fast if required secrets are not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$STAFF_EMAIL" ] || [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::RAILWAY_TOKEN/STAFF_EMAIL/STAFF_PASSWORD not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Log in as the staff account
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/staff_cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Staff login failed."
            exit 1
          fi

      - name: Probe each skipped-scan symbol (bar count + fundamentals presence)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          for SYM in $SKIPPED_SYMBOLS; do
            echo "=================== $SYM ==================="
            echo "--- GET /stocks/$SYM (DB identity) ---"
            curl -sS --connect-timeout 10 --max-time 20 -b /tmp/staff_cookies.txt \
              -w "\nHTTP %{http_code}\n" \
              "$BACKEND_URL/api/v1/stocks/$SYM"
            echo "--- GET /stocks/$SYM/history (real ingested bar count) ---"
            curl -sS --connect-timeout 10 --max-time 20 -b /tmp/staff_cookies.txt \
              "$BACKEND_URL/api/v1/stocks/$SYM/history" -o "/tmp/hist_$SYM.json"
            python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/print_bar_summary.py" "/tmp/hist_$SYM.json"
            echo "--- GET /stocks/$SYM/fundamentals ---"
            curl -sS --connect-timeout 10 --max-time 20 -b /tmp/staff_cookies.txt \
              -w "\nHTTP %{http_code}\n" \
              "$BACKEND_URL/api/v1/stocks/$SYM/fundamentals"
            echo
          done

      - name: Clean up local session artifacts
        if: always()
        run: rm -f /tmp/staff_cookies.txt /tmp/login_body.json
