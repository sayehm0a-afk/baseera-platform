name: Probe SAHMK /companies/ Filter Params (temporary, one-shot, read-only)

# Direct SAHMK API probe -- bypasses Basirah entirely. Tests whether the
# /companies/ directory endpoint (confirmed this session to report its
# own total as exactly 100 via the total/count/limit/offset envelope
# fields) accepts any documented-REST-style filter/pagination param that
# yields a DIFFERENT result -- specifically: a larger page size (limit/
# per_page/page_size), or a market/segment filter that might expose Nomu
# separately from the default Main-Market-weighted 100. This is a cheap,
# safe, read-only test of the one already-authorized SAHMK credential --
# it does not guess at undocumented ENDPOINTS (forbidden by the mandate),
# only at query-string parameter names on the one documented discovery
# endpoint, each logged with its raw HTTP status and total/count so nothing
# here is assumed to have worked without evidence.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
      SAHMK_BASE_URL: "https://app.sahmk.sa/api/v1"
    steps:
      - name: Fail fast if SAHMK_API_KEY is not configured
        run: |
          if [ -z "$SAHMK_API_KEY" ]; then
            echo "::error::SAHMK_API_KEY not set."
            exit 1
          fi

      - name: Probe /companies/ with candidate params (each call independent, real HTTP evidence only)
        run: |
          probe() {
            local label="$1"; shift
            local url="$SAHMK_BASE_URL/companies/$1"
            echo "=== $label ==="
            echo "URL: $url"
            HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 \
              -H "X-API-Key: $SAHMK_API_KEY" \
              -o /tmp/probe_body.json -w "%{http_code}" "$url")
            echo "HTTP $HTTP_CODE"
            python3 -c "
          import json
          try:
              d = json.load(open('/tmp/probe_body.json'))
              if isinstance(d, dict):
                  print('top-level keys:', sorted(d.keys()))
                  print('total:', d.get('total'), '| count:', d.get('count'))
                  results = d.get('results') or d.get('companies') or d.get('data')
                  if isinstance(results, list):
                      print('results length:', len(results))
              elif isinstance(d, list):
                  print('bare list length:', len(d))
              else:
                  print('unexpected type:', type(d))
          except Exception as exc:
              print('non-JSON or parse error:', exc)
              print(open('/tmp/probe_body.json').read()[:500])
          "
            echo ""
          }

          probe "baseline (no params)" ""
          probe "market=NOMU" "?market=NOMU"
          probe "market=nomu" "?market=nomu"
          probe "segment=NOMU" "?segment=NOMU"
          probe "market_segment=NOMU" "?market_segment=NOMU"
          probe "exchange=NOMU" "?exchange=NOMU"
          probe "type=nomu" "?type=nomu"
          probe "category=parallel" "?category=parallel"
          probe "market=parallel" "?market=parallel"
          probe "limit=500" "?limit=500"
          probe "page_size=500" "?page_size=500"
          probe "per_page=500" "?per_page=500"
          probe "page=2" "?page=2"
          probe "offset=100&limit=100" "?offset=100&limit=100"
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
