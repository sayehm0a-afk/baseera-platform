name: M10 Live Validation Session (temporary, one-shot, strict GO/NO-GO)

# Runs a strict LIVE GO/NO-GO check against real production, then --
# only if every check passes -- creates the real (is_dry_run=false) M10
# ValidationSession, runs exactly ONE controlled diagnostic scan as
# both the required live-freshness proof and the session's first real
# evidence, and closes the session. No mocking, no backfilling, no
# simulated data. See .github/workflows/independent_audit/m10_live_session.py
# for the full GO/NO-GO sequence and cost-protection logic.
#
# This workflow and its script are throwaway one-off tooling, same
# convention as dump-logs.yml / independent-audit.yml in this repo --
# not application code.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Verified M10 production commit SHA to require (blank = derive from checked-out HEAD)"
        required: false
        default: ""
  # One-shot auto-run for M10 LIVE SESSION 1, scheduled for the next
  # valid Tadawul trading day after the 2026-08-13 attempts both
  # correctly returned NO-GO (a real scan in progress, then exhausted
  # background SAHMK quota). 07:20 UTC = 10:20 Arabia Standard Time,
  # 20 minutes into Tadawul's 10:00-15:00 AST session -- a deliberate
  # buffer past the open-time race and past the live scheduler's own
  # first burst scan, so the "no conflicting scan running" gate has a
  # real chance to pass. Cron has no "year" field, so this expression
  # also matches every future Aug 16 -- m10_live_session.py's own
  # SCHEDULED_RUN_TARGET_DATE_UTC guard makes any firing that isn't
  # actually 2026-08-16 (UTC) a pure no-op before any HTTP call.
  schedule:
    - cron: "20 7 16 8 *"

permissions:
  contents: read

jobs:
  m10-live-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
      RAILWAY_BACKEND_SERVICE: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --quiet requests

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend: $BACKEND_URL"
          rm -f /tmp/backend_domains.json

      - name: Run M10 live GO/NO-GO + session
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/workflows/independent_audit/m10_live_session.py
