name: Production Universe Diagnostics (temporary, one-shot, read-only)

# Diagnostic-only: calls the new GET /api/v1/admin/market-intelligence/
# universe-diagnostics route, which runs a fresh (cached 24h, so cheap)
# SAHMK /companies/ directory call through universe_policy.classify_
# universe and returns its full per-field distinct-value breakdown.
# This is the real evidence for why nomu_market_stocks reads 0 in
# production despite 101 discovered symbols: instrument_bucket_counts
# already showed all 96 non-excluded equities landing in
# MAIN_MARKET_EQUITY_SEGMENT_UNCONFIRMED* (market_segment present but
# not matching "main"/"nomu"/"parallel"), which means the real SAHMK
# market_segment string value(s) were never actually seen by anyone --
# classify_universe computes distinct_observed_values but nothing
# exposed it until this route. Never triggers a new discovery/
# ingestion pass -- read-only.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: >
          Comma-separated symbols for symbol-lookup-diagnostics (defaults to
          the route's own built-in discovery-test pair if left blank). Set
          this to real, established dividend-paying symbols (e.g.
          2222,1120,1180,2050,1211) to investigate the dividends-coverage
          question instead of the discovery-cap question.
        required: false
        default: ""

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  fetch_diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Fail fast if required secrets are not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$STAFF_EMAIL" ] || [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::RAILWAY_TOKEN/STAFF_EMAIL/STAFF_PASSWORD not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Log in as the staff account
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/staff_cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Staff login failed."
            exit 1
          fi

      - name: Confirm exact deployed commit (GET /api/v1/admin/system/summary -- deployment_commit)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 30 -b /tmp/staff_cookies.txt \
            "$BACKEND_URL/api/v1/admin/system/summary" \
            -o /tmp/system_summary.json -w "%{http_code}")
          echo "HTTP $HTTP_CODE"
          python3 -c "import json; d = json.load(open('/tmp/system_summary.json')); print('deployment_commit:', d.get('deployment_commit')); print('app_version:', d.get('app_version')); print('environment:', d.get('environment'))" || cat /tmp/system_summary.json

      - name: Fetch universe diagnostics (real SAHMK /companies/ field values + pagination evidence)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 60 -b /tmp/staff_cookies.txt \
            "$BACKEND_URL/api/v1/admin/market-intelligence/universe-diagnostics" \
            -o /tmp/universe_diagnostics.json -w "%{http_code}")
          echo "HTTP $HTTP_CODE"
          python3 -m json.tool /tmp/universe_diagnostics.json

      - name: Fetch symbol-lookup diagnostics (real per-symbol SAHMK calls for symbols outside the ~100-instrument directory)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          SYMBOLS_INPUT: ${{ inputs.symbols }}
        run: |
          # 60s was not enough on a real dispatch after the directory grew
          # to 517 instruments (run 31263530580: curl (28) timeout, 0 bytes
          # received): this route does a fresh, uncached directory walk
          # (2 sequential SAHMK calls) plus 5 sequential real per-symbol
          # SAHMK calls per test symbol, with no concurrency -- legitimate
          # cumulative real-API latency, not a bug. 180s gives real
          # headroom without masking a genuine hang (job-level timeout is
          # still a hard 8-minute backstop above).
          SYMBOLS_QS=""
          if [ -n "${SYMBOLS_INPUT:-}" ]; then
            SYMBOLS_QS="?symbols=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['SYMBOLS_INPUT']))")"
          fi
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 180 -b /tmp/staff_cookies.txt \
            "$BACKEND_URL/api/v1/admin/market-intelligence/symbol-lookup-diagnostics$SYMBOLS_QS" \
            -o /tmp/symbol_lookup_diagnostics.json -w "%{http_code}")
          echo "HTTP $HTTP_CODE"
          python3 -m json.tool /tmp/symbol_lookup_diagnostics.json

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-diagnostics-evidence
          path: |
            /tmp/system_summary.json
            /tmp/universe_diagnostics.json
            /tmp/symbol_lookup_diagnostics.json
          retention-days: 14

      - name: Clean up local session artifacts
        if: always()
        run: rm -f /tmp/staff_cookies.txt /tmp/login_body.json
