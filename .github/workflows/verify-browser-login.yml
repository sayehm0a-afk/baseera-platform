name: Verify Browser Login (temporary, evidence-only)

# Real-browser (headless Chromium via Playwright) end-to-end check
# against the actual deployed production frontend/backend. This is the
# only way to genuinely prove "browser login works" -- curl (used by
# production-sahmk-verification.yml and the earlier diagnostic
# workflow) does not enforce SameSite/CORS the way a real browser
# does, which is exactly what caused this whole investigation. Makes
# no application code changes; to be deleted once the SameSite/CSRF
# fix (see git log) is confirmed working end-to-end.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend
  RAILWAY_FRONTEND_SERVICE: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve frontend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_FRONTEND_SERVICE" --json > /tmp/frontend_domains.json
          FRONTEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/frontend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "Frontend: $FRONTEND_URL"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Real-browser login -> dashboard -> reload -> logout
        working-directory: frontend
        env:
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: node scripts/verify_browser_login.js

      - name: Upload screenshots as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-login-evidence
          path: frontend/browser-login-evidence/*.png
          retention-days: 7
