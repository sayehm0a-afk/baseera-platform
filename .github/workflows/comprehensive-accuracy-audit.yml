name: Comprehensive real-accuracy audit (read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Pull every existing real-accuracy metric endpoint (no new computation, just consolidation)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          cat > /tmp/audit.py <<'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.request

          BACKEND = os.environ["BACKEND_URL"]
          STAFF_EMAIL = os.environ["STAFF_EMAIL"]
          STAFF_PASSWORD = os.environ["STAFF_PASSWORD"]

          def post(url, body, cookies=None):
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method="POST", headers={"Content-Type": "application/json"})
              if cookies:
                  req.add_header("Cookie", cookies)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read().decode(), resp.headers
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(), e.headers

          def get(url, cookies):
              req = urllib.request.Request(url, method="GET", headers={"Cookie": cookies})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          status, body, headers = post(f"{BACKEND}/api/v1/auth/login", {"email": STAFF_EMAIL, "password": STAFF_PASSWORD})
          cookie_pairs = [c.split(";")[0] for c in (headers.get_all("Set-Cookie") or [])]
          cookie_header = "; ".join(cookie_pairs)
          print(f"login status: {status}")
          print()

          endpoints = [
              ("calibration-status", "/api/v1/admin/ai-evolution/calibration-status"),
              ("personal-performance-h3", "/api/v1/admin/ai-evolution/personal-performance?evaluation_horizon_days=3"),
              ("personal-performance-h7", "/api/v1/admin/ai-evolution/personal-performance?evaluation_horizon_days=7"),
              ("radar-v2-performance", "/api/v1/admin/market-intelligence/radar-v2/performance"),
              ("radar-v2-performance-extended", "/api/v1/admin/market-intelligence/radar-v2/performance/extended"),
          ]

          for name, path in endpoints:
              print(f"=== {name}: GET {path} ===")
              status, body = get(f"{BACKEND}{path}", cookie_header)
              print(f"HTTP {status}")
              if status == 200:
                  print(json.dumps(json.loads(body), ensure_ascii=False, indent=2))
              else:
                  print(body[:1000])
              print()
          PYEOF
          python3 /tmp/audit.py
