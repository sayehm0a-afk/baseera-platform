name: Staging PR#114 - 3. Test accounts + shared-quota test (RAILWAY_STAGING_TOKEN only)

# Part 3 of 3 of the PR #114 controlled staging validation
# (docs/governance/staging-deployment-plan-pr114.md). Registers two
# clearly-labeled, disposable staging-only test accounts (a limited
# user and an admin), promotes the admin account directly against the
# ISOLATED staging database only (there is no self-service promotion
# endpoint in this codebase by design -- POST /admin/users/{id}/
# staff-role requires an existing OWNER), then runs the test this
# whole validation exists to answer: does one account exhausting its
# login rate-limit budget also block a completely different, valid
# account behind the SAME staging frontend proxy address?
#
# The two test-account passwords are intentionally-disposable,
# staging-only, zero-real-world-value credentials (the staging
# database is isolated and torn down within the approved 48-hour
# window) -- they are surfaced in this workflow's output so they can
# be relayed for manual Safari testing, which is the explicit purpose
# of creating them. This is unrelated to and never touches
# RAILWAY_STAGING_TOKEN, SECRET_KEY, DATABASE_URL, or REDIS_URL, none
# of which are ever printed anywhere in this file.

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Staging frontend URL (from staging-2's deployment summary)"
        required: true
      limited_user_email:
        description: "Override the limited-account email (default: PR114's own test account -- use a NEW address for a later round so you don't hit HTTP 409 against an already-registered account with an unrecoverable password)"
        required: false
        default: "staging-pr114-limited-user@example.com"
      admin_user_email:
        description: "Override the admin-account email (default: PR114's own test account -- same reuse caveat as above)"
        required: false
        default: "staging-pr114-admin@example.com"
      expected_deployment_commit:
        description: "If set, independently confirms the ADMIN's authenticated view of /api/v1/admin/system/summary reports exactly this deployment_commit before any other check runs -- proof the newly deployed code, not a stale cached instance, is what gets tested. Leave blank to skip."
        required: false
        default: ""

permissions:
  contents: read

env:
  EXPECTED_STAGING_PROJECT_ID: "7b3a7f9f-66da-460a-ba3e-9ca251f142f7"
  # example.test was rejected by the real registration endpoint: pydantic's
  # EmailStr calls email_validator.validate_email(..., check_deliverability=False)
  # (confirmed by reading pydantic.networks.validate_email's source against the
  # exact installed version), and email_validator 2.3.0 flags the .test TLD as
  # a reserved special-use domain -- verified locally with the same installed
  # email_validator/pydantic versions this app uses. example.com/.org/.net are
  # also RFC 2606-reserved (no real mailbox will ever receive anything sent to
  # them -- IANA operates only minimal DNS for them, no mail acceptance) but
  # are NOT flagged as special-use by email_validator, so they pass the exact
  # same validation the live endpoint performs. Verified locally:
  # validate_email("...@example.com", check_deliverability=False) succeeds.
  LIMITED_USER_EMAIL: ${{ github.event.inputs.limited_user_email }}
  ADMIN_USER_EMAIL: ${{ github.event.inputs.admin_user_email }}

jobs:
  accounts_and_test:
    name: Create test accounts, promote admin, run shared-quota test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
      FRONTEND_URL: ${{ github.event.inputs.frontend_url }}
      EXPECTED_DEPLOYMENT_COMMIT: ${{ github.event.inputs.expected_deployment_commit }}
    steps:
      - name: Fail fast if RAILWAY_STAGING_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_STAGING_TOKEN is not readable by this job."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests psycopg2-binary

      - name: PRE-FLIGHT -- verify this Railway CLI version actually supports tcp-proxy commands
        run: |
          echo "=== railway --version ==="
          railway --version
          echo "=== railway tcp-proxy --help ==="
          if ! railway tcp-proxy --help; then
            echo "::error::This Railway CLI version does not support 'tcp-proxy' -- refusing to proceed. Upgrade the CLI or use a different approach; do not guess further."
            exit 1
          fi
          echo "CONFIRMED: tcp-proxy subcommand is supported by the installed CLI."

      - name: HARD GATE -- re-verify this token resolves to the expected staging project
        run: |
          set +e
          railway status --json > /tmp/status.json
          STATUS_EXIT=$?
          set -e
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/status.json')).get('id','unknown'))" 2>/dev/null || echo unknown)
          if [ "$STATUS_EXIT" -ne 0 ] || [ "$PROJECT_ID" != "$EXPECTED_STAGING_PROJECT_ID" ]; then
            echo "::error::Token does not resolve to the expected staging project ($PROJECT_ID != $EXPECTED_STAGING_PROJECT_ID). Refusing to proceed."
            exit 1
          fi
          echo "CONFIRMED staging project."

      - name: Generate two disposable, staging-only test passwords
        id: passwords
        run: |
          echo "limited=Stg-$(python3 -c 'import secrets;print(secrets.token_urlsafe(12))')" >> "$GITHUB_OUTPUT"
          echo "admin=Stg-$(python3 -c 'import secrets;print(secrets.token_urlsafe(12))')" >> "$GITHUB_OUTPUT"

      - name: CONFIRM outbound email is disabled on staging (SMTP_HOST must be unset -- never print its value)
        run: |
          railway variable list --service backend --json > /tmp/bv.json 2>/dev/null || echo '{}' > /tmp/bv.json
          python3 -c "
          import json
          d = json.load(open('/tmp/bv.json'))
          if 'SMTP_HOST' in d:
              print('::error::SMTP_HOST IS SET on the backend service -- outbound email would be real, not console-logged. Refusing to register test accounts.')
              raise SystemExit(1)
          print('CONFIRMED: SMTP_HOST is not set -- get_email_sender() falls back to ConsoleEmailSender (src/auth/email_sender.py), no real email will be sent.')
          "
          rm -f /tmp/bv.json

      - name: Register both test accounts via the real /api/v1/auth/register flow -- hard-fail on any unexpected response
        env:
          LIMITED_PW: ${{ steps.passwords.outputs.limited }}
          ADMIN_PW: ${{ steps.passwords.outputs.admin }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, requests
          base = os.environ["FRONTEND_URL"].rstrip("/")
          for email, pw, label in [
              (os.environ["LIMITED_USER_EMAIL"], os.environ["LIMITED_PW"], "limited"),
              (os.environ["ADMIN_USER_EMAIL"], os.environ["ADMIN_PW"], "admin"),
          ]:
              r = requests.post(f"{base}/api/v1/auth/register", json={"email": email, "password": pw, "full_name": f"Staging PR114 {label} test"}, timeout=30)
              print(f"register {label} ({email}): HTTP {r.status_code}")
              if r.status_code == 201:
                  print(f"  -> freshly created.")
              elif r.status_code == 409:
                  print(f"  -> already exists from an earlier run. NOT treated as success yet -- this run's freshly-generated")
                  print(f"     password will only be proven valid by an actual login attempt later in this workflow. If that")
                  print(f"     login fails, the run will stop there with the real error, not silently assume this account is usable.")
              else:
                  print(f"::error::Unexpected registration response for {label} ({email}): HTTP {r.status_code}")
                  print(r.text[:1000])
                  sys.exit(1)
          PYEOF

      - name: Verify both test accounts' email and promote admin, directly against the isolated staging database
        run: |
          # Login requires is_email_verified=true (src/auth/user_service.py
          # authenticate() raises EmailNotVerifiedError otherwise), and there
          # is no self-service admin-promotion endpoint by design (POST
          # /admin/users/{id}/staff-role requires an existing OWNER). Both
          # are therefore set directly against the isolated staging database
          # -- the same disposable, staging-only, torn-down-within-48h
          # database referenced throughout this workflow.
          #
          # Confirmed against Railway's own docs (docs.railway.com/cli/ssh):
          # "SSH key management isn't supported with project tokens
          # (RAILWAY_TOKEN); use a workspace API token or run railway login."
          # -- railway ssh is permanently unavailable here without widening
          # this token's scope, which is out of bounds for this fix. The
          # previous attempt's mistake was using `railway domain` (creates an
          # HTTP-style Railway domain -- confirmed by its own "Target port: -"
          # output, unusable for Postgres's wire protocol) instead of the
          # correct, documented, distinct command for exposing a non-HTTP
          # port: `railway tcp-proxy create --port <port> --service <service>`
          # (docs.railway.com/cli/tcp-proxy). Idempotent: lists existing
          # proxies first and only creates one if none exists yet, mirroring
          # this file's existing domain-creation idiom.
          railway tcp-proxy list --service Postgres --json > /tmp/tcp.json 2>/dev/null || echo '[]' > /tmp/tcp.json
          cat /tmp/tcp.json
          PROXY_HOSTPORT=$(python3 -c "
          import json
          try:
              items = json.load(open('/tmp/tcp.json'))
          except Exception:
              items = []
          items = items if isinstance(items, list) else items.get('proxies', items.get('tcpProxies', items.get('edges', [])))
          for x in items:
              node = x.get('node', x) if isinstance(x, dict) else {}
              domain = node.get('domain') or node.get('proxyDomain')
              port = node.get('proxyPort') or node.get('port')
              if domain and port:
                  print(f'{domain}:{port}')
                  break
          " 2>/dev/null || echo "")
          echo "Existing TCP proxy (if any): ${PROXY_HOSTPORT:-<none>}"

          if [ -z "$PROXY_HOSTPORT" ]; then
            echo "=== No existing TCP proxy -- creating one (documented command) ==="
            set +e
            CREATE_OUT=$(railway tcp-proxy create --port 5432 --service Postgres 2>&1)
            CREATE_EXIT=$?
            set -e
            echo "$CREATE_OUT"
            echo "(exit code: $CREATE_EXIT)"
            if [ $CREATE_EXIT -ne 0 ]; then
              echo "::error::railway tcp-proxy create failed. See output above -- needs a follow-up fix, not a blind retry."
              exit 1
            fi

            sleep 5
            railway tcp-proxy list --service Postgres --json > /tmp/tcp.json 2>/dev/null || echo '[]' > /tmp/tcp.json
            cat /tmp/tcp.json
            PROXY_HOSTPORT=$(python3 -c "
          import json
          try:
              items = json.load(open('/tmp/tcp.json'))
          except Exception:
              items = []
          items = items if isinstance(items, list) else items.get('proxies', items.get('tcpProxies', items.get('edges', [])))
          for x in items:
              node = x.get('node', x) if isinstance(x, dict) else {}
              domain = node.get('domain') or node.get('proxyDomain')
              port = node.get('proxyPort') or node.get('port')
              if domain and port:
                  print(f'{domain}:{port}')
                  break
          " 2>/dev/null || echo "")

            if [ -z "$PROXY_HOSTPORT" ]; then
              echo "=== JSON parse found nothing -- falling back to text-parsing the create command's own output ==="
              PROXY_HOSTPORT=$(echo "$CREATE_OUT" | grep -Eo '[a-zA-Z0-9.-]+\.proxy\.rlwy\.net:[0-9]+' | head -1)
            fi
          fi

          echo "Resolved TCP proxy host:port: ${PROXY_HOSTPORT:-<none found>}"
          if [ -z "$PROXY_HOSTPORT" ]; then
            echo "::error::Could not obtain a public TCP endpoint for Postgres after both --json list and text-parsing fallback. See diagnostic output above -- this needs a follow-up fix, not a blind retry."
            exit 1
          fi
          PROXY_HOST=$(echo "$PROXY_HOSTPORT" | cut -d: -f1)
          PROXY_PORT=$(echo "$PROXY_HOSTPORT" | cut -d: -f2)

          railway variable list --service Postgres --json > /tmp/pv.json 2>/dev/null || echo '{}' > /tmp/pv.json
          python3 -c "import json; print('Available Postgres variable keys:', sorted(json.load(open('/tmp/pv.json')).keys()))"
          python3 - <<PYEOF
          import json, os
          import psycopg2
          d = json.load(open('/tmp/pv.json'))
          user = d.get('PGUSER') or d.get('POSTGRES_USER')
          password = d.get('PGPASSWORD') or d.get('POSTGRES_PASSWORD')
          dbname = d.get('PGDATABASE') or d.get('POSTGRES_DB')
          if not (user and password and dbname):
              raise SystemExit(f"Missing PG credential variable(s) on the Postgres service -- have keys: {sorted(d.keys())}")
          conn = psycopg2.connect(host="$PROXY_HOST", port=$PROXY_PORT, user=user, password=password, dbname=dbname)
          conn.autocommit = True
          cur = conn.cursor()

          target_emails = ["$LIMITED_USER_EMAIL", "$ADMIN_USER_EMAIL"]
          cur.execute("SELECT id, email FROM users WHERE email = ANY(%s)", (target_emails,))
          existing = cur.fetchall()
          print("Rows found for the two test emails before touching anything:", existing)
          found_emails = {row[1] for row in existing}
          missing = [e for e in target_emails if e not in found_emails]
          if missing:
              raise SystemExit(f"Registration reported success but these emails have NO row in the staging database: {missing} -- refusing to verify/promote anything.")

          cur.execute(
              "UPDATE users SET is_email_verified = true WHERE email = ANY(%s) RETURNING id, email, is_email_verified",
              (target_emails,),
          )
          rows = cur.fetchall()
          print("Verified:", rows)
          if len(rows) != 2:
              raise SystemExit(f"Expected to verify 2 accounts, verified {len(rows)} -- refusing to continue.")
          cur.execute(
              "UPDATE users SET is_staff = true, staff_role = 'OWNER' WHERE email = %s RETURNING id, email, is_staff, staff_role",
              ("$ADMIN_USER_EMAIL",),
          )
          row = cur.fetchone()
          print("Promoted:", row)
          if not row:
              raise SystemExit("Admin promotion failed -- refusing to continue.")
          conn.close()
          PYEOF
          rm -f /tmp/pv.json

      - name: PROVE both accounts actually exist and can log in with these exact credentials (before any adversarial traffic)
        env:
          LIMITED_PW: ${{ steps.passwords.outputs.limited }}
          ADMIN_PW: ${{ steps.passwords.outputs.admin }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, requests
          base = os.environ["FRONTEND_URL"].rstrip("/")
          for email, pw, label in [
              (os.environ["LIMITED_USER_EMAIL"], os.environ["LIMITED_PW"], "limited"),
              (os.environ["ADMIN_USER_EMAIL"], os.environ["ADMIN_PW"], "admin"),
          ]:
              r = requests.post(f"{base}/api/v1/auth/login", json={"email": email, "password": pw}, timeout=30)
              print(f"login proof {label} ({email}): HTTP {r.status_code}")
              if r.status_code != 200:
                  print(f"::error::{label} account login did NOT succeed with its own freshly-registered password -- HTTP {r.status_code}. Refusing to run the shared-quota test against an account that isn't actually usable.")
                  print(r.text[:500])
                  sys.exit(1)
          print("CONFIRMED: both accounts exist and their exact generated passwords log in successfully.")
          print("NOTE: these two clean logins consume 2 units of the shared network-address rate-limit ceiling")
          print("before the adversarial test below begins -- a realistic precondition, not an interference with the result.")
          PYEOF

      - name: Confirm permission separation (limited=non-staff, admin=staff) and the deployed commit, via authenticated sessions
        env:
          LIMITED_PW: ${{ steps.passwords.outputs.limited }}
          ADMIN_PW: ${{ steps.passwords.outputs.admin }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, requests
          base = os.environ["FRONTEND_URL"].rstrip("/")
          expected_commit = os.environ.get("EXPECTED_DEPLOYMENT_COMMIT", "")

          sessions = {}
          for email, pw, label in [
              (os.environ["LIMITED_USER_EMAIL"], os.environ["LIMITED_PW"], "limited"),
              (os.environ["ADMIN_USER_EMAIL"], os.environ["ADMIN_PW"], "admin"),
          ]:
              s = requests.Session()
              r = s.post(f"{base}/api/v1/auth/login", json={"email": email, "password": pw}, timeout=30)
              if r.status_code != 200:
                  print(f"::error::{label} login failed again on the second attempt (HTTP {r.status_code}) -- inconsistent with the proof above.")
                  sys.exit(1)
              sessions[label] = s

          me_limited = sessions["limited"].get(f"{base}/api/v1/auth/me", timeout=30)
          me_admin = sessions["admin"].get(f"{base}/api/v1/auth/me", timeout=30)
          print(f"limited /auth/me: HTTP {me_limited.status_code} is_staff={me_limited.json().get('is_staff') if me_limited.status_code == 200 else '?'}")
          print(f"admin   /auth/me: HTTP {me_admin.status_code} is_staff={me_admin.json().get('is_staff') if me_admin.status_code == 200 else '?'} staff_role={me_admin.json().get('staff_role') if me_admin.status_code == 200 else '?'}")
          if me_limited.status_code != 200 or me_limited.json().get("is_staff"):
              print("::error::Limited account unexpectedly has staff access (or /auth/me failed).")
              sys.exit(1)
          if me_admin.status_code != 200 or not me_admin.json().get("is_staff"):
              print("::error::Admin account does NOT have staff access after promotion.")
              sys.exit(1)
          print("CONFIRMED: permissions are correctly split -- limited=non-staff, admin=staff.")

          if expected_commit:
              summary = sessions["admin"].get(f"{base}/api/v1/admin/system/summary", timeout=30)
              print(f"admin /api/v1/admin/system/summary: HTTP {summary.status_code}")
              if summary.status_code != 200:
                  print("::error::Admin could not reach the staff-only system summary route.")
                  print(summary.text[:1000])
                  sys.exit(1)
              body = summary.json()
              actual_commit = body.get("deployment_commit") or body.get("commit") or body.get("deployed_commit")
              print(f"Reported deployment_commit: {actual_commit!r} (expected: {expected_commit!r})")
              if actual_commit and actual_commit != expected_commit:
                  print("::error::DEPLOYED COMMIT MISMATCH -- the running staging backend does not report the expected commit. Do not proceed with browser testing against this deployment.")
                  print(f"Full summary keys (for manual inspection if the field name above is wrong): {sorted(body.keys())}")
                  sys.exit(1)
              if not actual_commit:
                  print("::warning::No deployment_commit-like field found in the summary response -- cannot confirm the deployed SHA this way. Full keys: " + str(sorted(body.keys())))
              else:
                  print("CONFIRMED: the live staging backend reports the exact expected deployment_commit.")
          else:
              print("No expected_deployment_commit input given -- skipping the deployed-commit check.")
          PYEOF

      - name: THE SHARED-QUOTA TEST -- does exhausting one account's login limit block a different valid account behind the same proxy?
        env:
          ADMIN_PW: ${{ steps.passwords.outputs.admin }}
        run: |
          python3 - <<'PYEOF'
          import os, time, requests
          base = os.environ["FRONTEND_URL"].rstrip("/")
          limited_email = os.environ["LIMITED_USER_EMAIL"]
          admin_email = os.environ["ADMIN_USER_EMAIL"]
          admin_pw = os.environ["ADMIN_PW"]

          print("=== Step 1: 10 wrong-password login attempts for the LIMITED account, via the staging FRONTEND proxy ===")
          limited_statuses = []
          for i in range(10):
              r = requests.post(f"{base}/api/v1/auth/login", json={"email": limited_email, "password": "deliberately-wrong"}, timeout=30)
              limited_statuses.append(r.status_code)
              print(f"  attempt {i+1}: HTTP {r.status_code}")
          print(f"Limited-account attempt statuses: {limited_statuses}")

          print("\n=== Step 2: IMMEDIATELY, one login attempt for the ADMIN account with its CORRECT password, same frontend proxy ===")
          r = requests.post(f"{base}/api/v1/auth/login", json={"email": admin_email, "password": admin_pw}, timeout=30)
          print(f"Admin login attempt (correct credentials): HTTP {r.status_code}")
          print(r.text[:500])

          print("\n=== RESULT ===")
          if r.status_code == 429:
              print("CONFIRMED: the admin account, with fully valid credentials, was blocked by the network-address ceiling")
              print("exhausted by the UNRELATED limited-user account -- the shared-proxy rate-limit risk documented in the")
              print("independent security review is REAL on actual Railway infrastructure, not just a theoretical concern.")
          elif r.status_code == 200:
              print("UNEXPECTED: the admin account logged in successfully despite the limited account's budget being exhausted.")
              print("This means request.client.host was NOT actually shared between these two requests on Railway's real")
              print("infrastructure as expected -- needs further investigation before relying on this in production capacity planning.")
          else:
              print(f"Neither a clean 429 nor a clean 200 -- HTTP {r.status_code} needs manual investigation (see body above).")
          PYEOF

      - name: Summary for the user (these are disposable staging-only test accounts, not production secrets -- isolated DB, torn down within 48h)
        env:
          LIMITED_PW: ${{ steps.passwords.outputs.limited }}
          ADMIN_PW: ${{ steps.passwords.outputs.admin }}
        run: |
          echo "======================================================"
          echo " STAGING TEST ACCOUNTS (validation only -- NOT production)"
          echo "======================================================"
          echo "Limited user -- email: $LIMITED_USER_EMAIL  password: $LIMITED_PW"
          echo "Admin        -- email: $ADMIN_USER_EMAIL  password: $ADMIN_PW"
          echo "These exist only in the isolated staging database and will be deleted with the rest of the staging project within the approved 48-hour window."
