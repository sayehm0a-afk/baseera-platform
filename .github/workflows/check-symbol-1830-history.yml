name: Check symbol 1830 recommendation history + current live opportunities (read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Login and check symbol 1830 + current live opportunities
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          cat > /tmp/check.py <<'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.request

          BACKEND = os.environ["BACKEND_URL"]
          STAFF_EMAIL = os.environ["STAFF_EMAIL"]
          STAFF_PASSWORD = os.environ["STAFF_PASSWORD"]

          def post(url, body, cookies=None):
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method="POST", headers={"Content-Type": "application/json"})
              if cookies:
                  req.add_header("Cookie", cookies)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read().decode(), resp.headers
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(), e.headers

          def get(url, cookies):
              req = urllib.request.Request(url, method="GET", headers={"Cookie": cookies})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          status, body, headers = post(f"{BACKEND}/api/v1/auth/login", {"email": STAFF_EMAIL, "password": STAFF_PASSWORD})
          cookie_pairs = [c.split(";")[0] for c in (headers.get_all("Set-Cookie") or [])]
          cookie_header = "; ".join(cookie_pairs)

          print("=== GET /api/v1/stocks/1830/decision-v2 (current live decision detail) ===")
          status, body = get(f"{BACKEND}/api/v1/stocks/1830/decision-v2", cookie_header)
          print(f"HTTP {status}")
          if status == 200:
              d = json.loads(body)
              for k in ["symbol", "decision", "decision_label_ar", "confidence_score", "current_price",
                        "entry_zone_low", "entry_zone_high", "stop_loss", "target_1", "decision_timestamp",
                        "market_status", "entry_status", "entry_status_label_ar"]:
                  print(f"{k}: {d.get(k)}")
          else:
              print(body[:2000])

          print()
          print("=== GET /api/v1/radar/opportunities (all current live radar opportunities) ===")
          status, body = get(f"{BACKEND}/api/v1/radar/opportunities?limit=200", cookie_header)
          print(f"HTTP {status}")
          if status == 200:
              rows = json.loads(body)
              print("total live opportunities:", len(rows))
              for r in rows:
                  print(json.dumps({
                      "symbol": r.get("symbol"),
                      "emitted_at": r.get("emitted_at"),
                      "classification": r.get("classification"),
                      "confidence_score": r.get("confidence_score"),
                      "entry_status": r.get("entry_status"),
                      "is_decision_fresh": r.get("is_decision_fresh"),
                      "stop_loss": r.get("stop_loss"),
                      "price_at_signal": r.get("price_at_signal"),
                  }, ensure_ascii=False))
          else:
              print(body[:2000])
          PYEOF
          python3 /tmp/check.py
