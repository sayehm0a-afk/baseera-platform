name: Trigger Fresh Market Scan (temporary, one-shot)

# One-off: triggers a real POST /api/v1/market/scan (no symbols specified
# -- SymbolSelector picks every active, price-history-eligible symbol,
# i.e. the corrected universe after the sector/dividends/OHLCV coverage
# fixes), then polls GET /api/v1/market/scan/{run_id}/progress until the
# run finishes or the job timeout is hit. No new backend code, no new
# routes -- both endpoints are the already-deployed customer-facing scan
# API (src/api/routes/market.py).

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  trigger_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Fail fast if required secrets are not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$STAFF_EMAIL" ] || [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::RAILWAY_TOKEN/STAFF_EMAIL/STAFF_PASSWORD not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Log in as the staff account
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/staff_cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Staff login failed."
            exit 1
          fi

      - name: POST /api/v1/market/scan (empty body -- scans every active, price-history-eligible symbol)
        id: create_scan
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          # CSRFMiddleware (src/api/middleware/csrf.py) requires every
          # non-GET /api/v1/* request made with a session cookie to echo
          # the non-httpOnly csrf_token cookie back as X-CSRF-Token --
          # read it straight out of curl's Netscape-format cookie jar.
          CSRF_TOKEN=$(awk -F'\t' '$6 == "csrf_token" {print $7}' /tmp/staff_cookies.txt)
          if [ -z "$CSRF_TOKEN" ]; then
            echo "::error::No csrf_token cookie found after login."
            exit 1
          fi
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 30 -b /tmp/staff_cookies.txt \
            -X POST "$BACKEND_URL/api/v1/market/scan" \
            -H "Content-Type: application/json" \
            -H "X-CSRF-Token: $CSRF_TOKEN" \
            -d '{}' \
            -o /tmp/scan_create.json -w "%{http_code}")
          echo "HTTP $HTTP_CODE"
          cat /tmp/scan_create.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to create scan run."
            exit 1
          fi
          RUN_ID=$(python3 -c "import json; print(json.load(open('/tmp/scan_create.json'))['id'])")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Created MarketScanRun id=$RUN_ID"

      - name: Poll scan progress until it finishes (or job timeout)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          RUN_ID: ${{ steps.create_scan.outputs.run_id }}
        run: |
          for i in $(seq 1 85); do
            HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -b /tmp/staff_cookies.txt \
              "$BACKEND_URL/api/v1/market/scan/$RUN_ID" -o /tmp/scan_status.json -w "%{http_code}")
            STATUS=$(python3 -c "import json; print(json.load(open('/tmp/scan_status.json')).get('status'))" 2>/dev/null || echo "UNKNOWN")
            echo "[$i] HTTP $HTTP_CODE status=$STATUS"
            if [ "$STATUS" = "SUCCESS" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "PARTIAL" ]; then
              break
            fi
            sleep 20
          done
          echo "=== Final scan run state ==="
          python3 -m json.tool /tmp/scan_status.json

      - name: Fetch final scan progress detail
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          RUN_ID: ${{ steps.create_scan.outputs.run_id }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/staff_cookies.txt -w "\nHTTP %{http_code}\n" \
            "$BACKEND_URL/api/v1/market/scan/$RUN_ID/progress" | python3 -m json.tool || true

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-scan-evidence
          path: |
            /tmp/scan_create.json
            /tmp/scan_status.json
          retention-days: 14

      - name: Clean up local session artifacts
        if: always()
        run: rm -f /tmp/staff_cookies.txt /tmp/login_body.json
