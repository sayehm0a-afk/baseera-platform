name: Phase 2 Recommendation Evidence (temporary, one-shot, read-only, zero SAHMK cost)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Gather Phase 2 recommendation-validation evidence
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: python3 .github/workflows/independent_audit/phase2_recommendation_evidence.py
