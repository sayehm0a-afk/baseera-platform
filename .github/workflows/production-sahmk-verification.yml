name: Production SAHMK Verification

# Single workflow_dispatch-only job -- real production validation of
# the already-deployed Basirah backend/frontend on Railway. Never
# creates/modifies Railway infrastructure (that's deploy-railway.yml's
# job); this workflow only talks to the already-running public HTTPS
# backend/frontend using an existing staff account's own credentials.
#
# History: earlier revisions of this workflow tried to bootstrap a
# throwaway OWNER account for each run, first via `railway run`, then
# via `railway ssh` with a freshly registered SSH key. Both were
# abandoned after real dispatched runs proved them structurally
# blocked from a GitHub Actions runner: `railway run` only injects env
# vars into a LOCAL process, so DATABASE_URL's internal hostname
# (postgres.railway.internal) never resolves; the Postgres service
# exposes no public proxy URL as a fallback; and `railway ssh keys
# add/remove` (needed to reach the container directly) is rejected
# outright with a project-scoped RAILWAY_TOKEN ("SSH key management is
# not supported with project tokens"). This revision instead logs in
# as an already-existing staff/OWNER account over the public HTTPS API
# -- no Railway CLI DB/SSH access needed at all.
#
# Flow:
#   1. Confirm backend/frontend/db/redis are healthy (real HTTP calls
#      against the public URLs, same routes deploy-railway.yml itself
#      checks).
#   2. Log in as the existing staff account (STAFF_EMAIL/STAFF_PASSWORD
#      secrets -- must already have ADMIN or OWNER role in production;
#      the diagnostic-scan route below requires at least ADMIN).
#   3. Call the staff-only POST /api/v1/admin/market-intelligence/
#      diagnostic-scan (one real, controlled SAHMK poll through the
#      exact production scan path), and capture the full JSON response
#      as evidence.
#   4. Verify the same data is readable back through the public,
#      customer-facing GET /api/v1/market/summary and
#      GET /api/v1/market/rankings routes.
#   5. Verify the frontend actually renders without a demo/placeholder
#      shell (real HTTP fetch of the dashboard page).
#
# RAILWAY_TOKEN (only used to resolve the backend/frontend public
# domains) and STAFF_EMAIL/STAFF_PASSWORD are read only as GitHub
# Actions secrets and never echoed. SAHMK_API_KEY itself is never read
# by this workflow at all -- it lives only in the backend service's
# own Railway environment and is never passed to or through this job.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend
  RAILWAY_FRONTEND_SERVICE: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail fast if required secrets are not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set."
            exit 1
          fi
          echo "RAILWAY_TOKEN present (length ${#RAILWAY_TOKEN})"
          if [ -z "$STAFF_EMAIL" ] || [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::STAFF_EMAIL/STAFF_PASSWORD are not set. These must belong to an" \
                 "existing production account with ADMIN or OWNER staff role -- the" \
                 "diagnostic-scan route this workflow calls requires at least ADMIN."
            exit 1
          fi
          echo "STAFF_EMAIL present (length ${#STAFF_EMAIL})"
          echo "STAFF_PASSWORD present (length ${#STAFF_PASSWORD})"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend/frontend public URLs
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          railway domain list --service "$RAILWAY_FRONTEND_SERVICE" --json > /tmp/frontend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          FRONTEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/frontend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend:  $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"

      - name: Confirm backend/frontend/db/redis are healthy right now
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: |
          echo "=== /health/live ==="
          curl -sS --connect-timeout 10 --max-time 20 -w "\nHTTP %{http_code}\n" "$BACKEND_URL/health/live" || echo "(request failed)"
          echo "=== /health/ready ==="
          curl -sS --connect-timeout 10 --max-time 20 -w "\nHTTP %{http_code}\n" "$BACKEND_URL/health/ready" || echo "(request failed)"
          echo "=== frontend / ==="
          curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" "$FRONTEND_URL/" || echo "(request failed)"

      - name: Log in as the staff account
        id: login
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP status: $HTTP_CODE"
          cat /tmp/login_body.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Login as the staff account failed."
            exit 1
          fi
          CSRF=$(grep -i csrf_token /tmp/cookies.txt | awk '{print $NF}')
          echo "csrf_present=$([ -n \"$CSRF\" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "$CSRF" > /tmp/.csrf

      - name: Trigger the real, controlled SAHMK diagnostic scan
        id: diagnostic
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          CSRF=$(cat /tmp/.csrf)
          curl -sS --connect-timeout 10 --max-time 120 -b /tmp/cookies.txt \
            -X POST "$BACKEND_URL/api/v1/admin/market-intelligence/diagnostic-scan" \
            -H "Content-Type: application/json" \
            -H "x-csrf-token: $CSRF" \
            -d '{}' \
            -o /tmp/diagnostic.json -w "\nHTTP %{http_code}\n"
          echo "=== Diagnostic scan result ==="
          python3 -m json.tool /tmp/diagnostic.json

      - name: Verify the same data is readable through the public market API
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          RUN_ID=$(python3 -c "import json; d=json.load(open('/tmp/diagnostic.json')); print(d.get('run_id') or '')")
          echo "run_id from diagnostic scan: ${RUN_ID:-<none -- scan did not run>}"
          if [ -n "$RUN_ID" ]; then
            QS="?run_id=$RUN_ID"
          else
            # The diagnostic scan's own overlap guard skips writing a
            # sample when a real POST /market/scan run is already
            # RUNNING in production -- that is a sign the Live Market
            # Mode scheduler is doing its job, not a failure. Falling
            # back to no run_id lets /summary and /rankings resolve to
            # the latest *successful* run (see market.py::_resolve_run)
            # instead of skipping the public-API check outright.
            echo "No fresh run_id from the diagnostic scan (see its sahmk_error field above) --" \
                 "falling back to the latest successful scan run instead of skipping this check."
            QS=""
          fi
          echo "=== GET /api/v1/market/summary$QS ==="
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt -w "\nHTTP %{http_code}\n" \
            "$BACKEND_URL/api/v1/market/summary$QS"
          echo "=== GET /api/v1/market/rankings$QS ==="
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt -w "\nHTTP %{http_code}\n" \
            "$BACKEND_URL/api/v1/market/rankings$QS"

      - name: Verify the frontend renders without a demo/placeholder shell
        env:
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -o /tmp/dashboard.html -w "HTTP %{http_code}\n" "$FRONTEND_URL/dashboard" || true
          echo "Bytes fetched: $(wc -c < /tmp/dashboard.html 2>/dev/null || echo 0)"
          if grep -qiE "lorem ipsum|placeholder-data|demo-mode|mock-data" /tmp/dashboard.html 2>/dev/null; then
            echo "::error::Frontend dashboard HTML contains a demo/placeholder marker."
            exit 1
          fi
          echo "No demo/placeholder marker found in the dashboard HTML."

      - name: Clean up local session artifacts
        if: always()
        run: |
          rm -f /tmp/.csrf /tmp/cookies.txt /tmp/login_body.json /tmp/diagnostic.json
