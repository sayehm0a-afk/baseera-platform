name: Production SAHMK Verification

# Single workflow_dispatch-only job -- real production validation of
# the already-deployed Basirah backend/frontend on Railway. Never
# creates/modifies Railway infrastructure (that's deploy-railway.yml's
# job); this workflow only talks to the already-running public
# HTTPS backend/frontend and a temporary application-level admin
# account it creates and deletes within the same run.
#
# Flow:
#   1. Confirm backend/frontend/db/redis are healthy (real HTTP calls
#      against the public URLs, same routes deploy-railway.yml itself
#      checks).
#   2. Generate a fresh ephemeral ed25519 SSH keypair for this run only
#      and register the public half with Railway (`railway ssh keys
#      add`) -- required for `railway ssh` below, which executes a
#      command *inside* the real deployed container rather than just
#      injecting env vars locally (the latter, `railway run`, cannot
#      reach Railway's private-network-only DATABASE_URL host from a
#      GitHub Actions runner). The key is removed again at the end.
#   3. Bootstrap a temporary OWNER-role account via
#      scripts/bootstrap_owner.py, executed with `railway ssh` (runs
#      *inside* the real backend container, where DATABASE_URL's
#      internal hostname actually resolves) so it runs against the
#      real production database without that value ever being printed
#      or leaving Railway's own network. A random password is
#      generated fresh for this run only, never logged.
#   4. Log in as that account, call the new staff-only
#      POST /api/v1/admin/market-intelligence/diagnostic-scan (one
#      real, controlled SAHMK poll through the exact production scan
#      path), and capture the full JSON response as evidence.
#   5. Verify the same data is readable back through the public,
#      customer-facing GET /api/v1/market/summary and
#      GET /api/v1/market/rankings routes.
#   6. Verify the frontend actually renders without a demo/placeholder
#      shell (real HTTP fetch of the dashboard page).
#   7. Delete the temporary account and the ephemeral SSH key (both via
#      the same `railway ssh` mechanism) -- no permanent credential is
#      left in production once this run completes.
#
# RAILWAY_TOKEN and SAHMK_API_KEY are read only as GitHub Actions
# secrets and never echoed; the temporary account's own password is
# generated at runtime and never printed either.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend
  RAILWAY_FRONTEND_SERVICE: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail fast if RAILWAY_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set."
            exit 1
          fi
          echo "RAILWAY_TOKEN present (length ${#RAILWAY_TOKEN})"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend/frontend public URLs
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          railway domain list --service "$RAILWAY_FRONTEND_SERVICE" --json > /tmp/frontend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          FRONTEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/frontend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend:  $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"

      - name: Confirm backend/frontend/db/redis are healthy right now
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: |
          echo "=== /health/live ==="
          curl -sS --connect-timeout 10 --max-time 20 -w "\nHTTP %{http_code}\n" "$BACKEND_URL/health/live" || echo "(request failed)"
          echo "=== /health/ready ==="
          curl -sS --connect-timeout 10 --max-time 20 -w "\nHTTP %{http_code}\n" "$BACKEND_URL/health/ready" || echo "(request failed)"
          echo "=== frontend / ==="
          curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" "$FRONTEND_URL/" || echo "(request failed)"

      # `railway run` only injects env vars into a LOCAL process -- confirmed
      # by runs #2/#3, which resolved DATABASE_URL to postgres.railway.internal
      # (Railway's private DNS) and failed to connect, since the GitHub
      # Actions runner is outside Railway's own network, and the backend
      # service exposes no public DB proxy variable. `railway ssh` instead
      # executes the given command *inside* the real deployed container
      # (confirmed via `railway ssh --help`: "[COMMAND]... Command to
      # execute instead of starting an interactive shell"), where internal
      # hostnames resolve and the production venv is already installed --
      # but it requires a registered SSH keypair (confirmed by run #4's
      # "No SSH keys found" error). Generate a fresh ephemeral ed25519
      # keypair for this run only, register the public half with Railway
      # (confirmed syntax via `railway ssh keys add --help`: -k <path>),
      # and remove it again in the final cleanup step -- no key persists
      # on the account past this run.
      - name: Generate and register an ephemeral SSH key for this run
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_verify_key -N "" -C "prod-verify-$(date +%s)" -q
          chmod 600 /tmp/ci_verify_key
          railway ssh keys add -k /tmp/ci_verify_key.pub -n "prod-verify-$(date +%s)"

      - name: Bootstrap a temporary OWNER account for this verification run
        id: account
        run: |
          TEMP_EMAIL="prod-verify-$(date +%s)-$RANDOM@example.com"
          TEMP_PASSWORD=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          echo "temp_email=$TEMP_EMAIL" >> "$GITHUB_OUTPUT"
          # Never echo TEMP_PASSWORD. Written to a runner-local file only,
          # read back by later steps, and the file is removed at the end.
          echo "$TEMP_PASSWORD" > /tmp/.temp_pw
          chmod 600 /tmp/.temp_pw
          printf '%s\n%s\n' "$TEMP_PASSWORD" "$TEMP_PASSWORD" | railway ssh --identity-file /tmp/ci_verify_key --service "$RAILWAY_BACKEND_SERVICE" -- python3 scripts/bootstrap_owner.py --email "$TEMP_EMAIL"

      - name: Log in as the temporary account
        id: login
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          TEMP_EMAIL: ${{ steps.account.outputs.temp_email }}
        run: |
          TEMP_PASSWORD=$(cat /tmp/.temp_pw)
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": \"$TEMP_EMAIL\", \"password\": $(python3 -c "import json,sys; print(json.dumps(sys.stdin.read().strip()))" < /tmp/.temp_pw)}")
          echo "Login HTTP status: $HTTP_CODE"
          cat /tmp/login_body.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Login as the temporary verification account failed."
            exit 1
          fi
          CSRF=$(grep -i csrf_token /tmp/cookies.txt | awk '{print $NF}')
          echo "csrf_present=$([ -n \"$CSRF\" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "$CSRF" > /tmp/.csrf

      - name: Trigger the real, controlled SAHMK diagnostic scan
        id: diagnostic
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          CSRF=$(cat /tmp/.csrf)
          curl -sS --connect-timeout 10 --max-time 120 -b /tmp/cookies.txt \
            -X POST "$BACKEND_URL/api/v1/admin/market-intelligence/diagnostic-scan" \
            -H "Content-Type: application/json" \
            -H "x-csrf-token: $CSRF" \
            -d '{}' \
            -o /tmp/diagnostic.json -w "\nHTTP %{http_code}\n"
          echo "=== Diagnostic scan result ==="
          python3 -m json.tool /tmp/diagnostic.json

      - name: Verify the same data is readable through the public market API
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          RUN_ID=$(python3 -c "import json; d=json.load(open('/tmp/diagnostic.json')); print(d.get('run_id') or '')")
          echo "run_id from diagnostic scan: ${RUN_ID:-<none -- scan did not run>}"
          if [ -n "$RUN_ID" ]; then
            echo "=== GET /api/v1/market/summary?run_id=$RUN_ID ==="
            curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt -w "\nHTTP %{http_code}\n" \
              "$BACKEND_URL/api/v1/market/summary?run_id=$RUN_ID"
            echo "=== GET /api/v1/market/rankings?run_id=$RUN_ID ==="
            curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt -w "\nHTTP %{http_code}\n" \
              "$BACKEND_URL/api/v1/market/rankings?run_id=$RUN_ID"
          else
            echo "No run_id -- diagnostic scan did not persist a run (see its sahmk_error field above). Skipping public-API cross-check."
          fi

      - name: Verify the frontend renders without a demo/placeholder shell
        env:
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -o /tmp/dashboard.html -w "HTTP %{http_code}\n" "$FRONTEND_URL/dashboard" || true
          echo "Bytes fetched: $(wc -c < /tmp/dashboard.html 2>/dev/null || echo 0)"
          if grep -qiE "lorem ipsum|placeholder-data|demo-mode|mock-data" /tmp/dashboard.html 2>/dev/null; then
            echo "::error::Frontend dashboard HTML contains a demo/placeholder marker."
            exit 1
          fi
          echo "No demo/placeholder marker found in the dashboard HTML."

      - name: Delete the temporary verification account
        if: always()
        env:
          TEMP_EMAIL: ${{ steps.account.outputs.temp_email }}
        run: |
          if [ -z "$TEMP_EMAIL" ]; then
            echo "No temporary account was recorded -- nothing to delete."
            exit 0
          fi
          railway ssh --identity-file /tmp/ci_verify_key --service "$RAILWAY_BACKEND_SERVICE" -- python3 -c "from src.auth.repository import AuthRepository; from src.core.db.database import get_session_factory; repo = AuthRepository(); session = get_session_factory()(); user = repo.get_user_by_email(session, '$TEMP_EMAIL'); (repo.delete_user(session, user.id), session.commit(), print('Deleted temporary verification account $TEMP_EMAIL.')) if user is not None else print('No user found for $TEMP_EMAIL -- already gone.'); session.close()" || echo "::warning::Cleanup of the temporary account may have failed -- check manually."
          rm -f /tmp/.temp_pw /tmp/.csrf /tmp/cookies.txt

      - name: Remove the ephemeral SSH key registered with Railway
        if: always()
        run: |
          if [ ! -f /tmp/ci_verify_key.pub ]; then
            echo "No ephemeral key was generated -- nothing to remove."
            exit 0
          fi
          railway ssh keys remove -k /tmp/ci_verify_key.pub || echo "::warning::Removing the ephemeral SSH key from Railway may have failed -- check manually under railway ssh keys list."
          rm -f /tmp/ci_verify_key /tmp/ci_verify_key.pub
