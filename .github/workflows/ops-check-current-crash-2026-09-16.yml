name: Ops - Diagnose live crash/build-failure emails (read-only, 2026-09-16)

# Read-only diagnostic dispatched in direct response to real Railway
# "Deployment crashed" / "Build failed" emails received around 08:07-
# 08:14 UTC on 2026-09-16. Two consecutive frontend deployments have
# failed on unchanged frontend code. `railway logs --help` (previous
# pass) revealed the correct syntax: the deployment id is a positional
# argument to --build (not --deployment), and --latest forces showing
# the latest deployment's logs even if it failed/is still building.
# Never modifies anything.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Real build logs for the latest (failed) frontend deployment
        run: railway logs --service frontend --build --latest --lines 300 2>&1 || echo "(could not fetch)"
