name: Diagnose Scan Run (temporary, evidence-only)

# One-off diagnostic tool: queries the real production state of a single
# MarketScanRun via the existing, already-deployed customer-facing
# GET /api/v1/market/scan/{run_id} and GET /api/v1/market/scan/{run_id}/progress
# routes (src/api/routes/market.py) -- no new backend code, no new routes.
# Used to determine whether a run the diagnostic-scan overlap guard
# reported as "RUNNING" is actually still progressing or is stuck.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "MarketScanRun id to inspect"
        required: true

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend: $BACKEND_URL"

      - name: Log in as the staff account
        id: login
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Login as the staff account failed."
            cat /tmp/login_body.json
            exit 1
          fi

      - name: GET /api/v1/market/scan/{run_id}
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          echo "=== GET /api/v1/market/scan/$RUN_ID ==="
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt -w "\nHTTP %{http_code}\n" \
            "$BACKEND_URL/api/v1/market/scan/$RUN_ID"

      - name: GET /api/v1/market/scan/{run_id}/progress
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          echo "=== GET /api/v1/market/scan/$RUN_ID/progress ==="
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt -w "\nHTTP %{http_code}\n" \
            "$BACKEND_URL/api/v1/market/scan/$RUN_ID/progress"

      - name: Server time (for staleness comparison)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          echo "=== GET /api/v1/market/status ==="
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt -w "\nHTTP %{http_code}\n" \
            "$BACKEND_URL/api/v1/market/status"

      - name: Backend logs around the run's stall window (real Railway logs)
        run: |
          # `railway logs` streams indefinitely like `tail -f` -- bound it with
          # `timeout` so this step can never hang the job even if the CLI ignores
          # SIGPIPE from `tail`.
          timeout 25 railway logs --service "$RAILWAY_BACKEND_SERVICE" 2>&1 | tail -n 500 || echo "(railway logs unavailable or timed out -- see exit status above)"

      - name: Clean up local session artifacts
        if: always()
        run: rm -f /tmp/cookies.txt /tmp/login_body.json
