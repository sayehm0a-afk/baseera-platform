name: Bootstrap Owner (one-time)

# Single workflow_dispatch-only job -- calls the temporary, self-disabling
# POST /api/v1/bootstrap/owner (src/api/routes/bootstrap.py) to create the
# very first production OWNER account, using only GitHub Actions secrets
# so BOOTSTRAP_TOKEN and the new account's password never appear in this
# repository, in chat, or anywhere else outside Railway's/GitHub's own
# secret stores.
#
# Meant to be run exactly once. After a confirmed 201 response:
#   1. Delete BOOTSTRAP_TOKEN from Railway's environment variables.
#   2. Delete the BOOTSTRAP_TOKEN GitHub Actions secret.
#   3. Remove src/api/routes/bootstrap.py, src/auth/bootstrap_service.py,
#      and this workflow file from the repository, and redeploy.
# The endpoint itself also self-disables permanently the moment an OWNER
# account exists (enforced by real DB state, not by removing this
# workflow), so step 3 is cleanup, not the safety mechanism.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail fast if required secrets are not configured
        run: |
          for name in RAILWAY_TOKEN BOOTSTRAP_TOKEN STAFF_EMAIL STAFF_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set."
              exit 1
            fi
            echo "$name present (length ${#value})"
          done

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend: $BACKEND_URL"

      - name: Call POST /api/v1/bootstrap/owner
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/bootstrap_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/bootstrap/owner" \
            -H "Content-Type: application/json" \
            -H "x-bootstrap-token: $BOOTSTRAP_TOKEN" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "HTTP status: $HTTP_CODE"
          echo "=== Response (never includes a password) ==="
          python3 -m json.tool /tmp/bootstrap_body.json
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Bootstrap call did not return 201 -- see the response above for the reason (401 = bad/missing token, 403 = an OWNER already exists, 409 = email already registered, 422 = password too short)."
            exit 1
          fi
          echo "::notice::OWNER account created successfully. Next: delete BOOTSTRAP_TOKEN from Railway and GitHub secrets, and remove the bootstrap endpoint from the codebase."
