name: Diagnose SAHMK /market/sectors/ endpoint shape (read-only, SAHMK_API_KEY only)

# docs/SAHMK_INTEGRATION.md documents GET /market/{gainers,losers,volume,
# value,sectors}/ (Free tier) as "Not implemented" -- and separately,
# real production logs (2026-09-12) show the company directory
# (GET /companies/) has ZERO sector data under any of the field names
# this codebase currently tries (sector/sector_name/sectorName/
# gics_sector/sector_ar/sector_en), for all 519 companies. Its raw
# top-level keys are is_etf/market/market_segment/name_ar/name_en/
# security_type/status/symbol -- no sector-shaped field at all.
#
# This means sector-relative-strength analysis (a real, already-built
# analyst-intelligence mechanism) is silently NOT_EVALUATED for every
# symbol right now, because the code has been looking for sector data
# on the wrong endpoint. This diagnostic makes exactly one real,
# read-only GET request to the documented-but-unimplemented
# /market/sectors/ endpoint to see its actual response shape, so the
# real ingestion code can be written against real evidence instead of
# guessing field names (matching this repo's STRICT_REAL_DATA
# discipline). No production code path is touched by this workflow.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
    steps:
      - name: Fail fast if SAHMK_API_KEY is not configured
        run: |
          if [ -z "$SAHMK_API_KEY" ]; then
            echo "::error::SAHMK_API_KEY is not set."
            exit 1
          fi

      - name: GET /market/sectors/ and print raw shape (no secret ever echoed)
        run: |
          curl -sS -H "X-API-Key: $SAHMK_API_KEY" \
            "https://app.sahmk.sa/api/v1/market/sectors/" \
            -o /tmp/sectors.json -w "\nHTTP:%{http_code}\n"
          echo "=== raw body (first 4000 chars) ==="
          head -c 4000 /tmp/sectors.json
          echo
          echo "=== structure summary ==="
          cat > /tmp/summarize_sectors.py <<'PYEOF'
          import json
          try:
              d = json.load(open('/tmp/sectors.json'))
          except Exception as exc:
              print('COULD NOT PARSE AS JSON:', exc)
              raise SystemExit(0)
          print('top-level type:', type(d).__name__)
          if isinstance(d, dict):
              print('top-level keys:', sorted(d.keys()))
              for key in ('results', 'sectors', 'data', 'items'):
                  if key in d and isinstance(d[key], list) and d[key]:
                      print(f'first item under "{key}":', json.dumps(d[key][0], ensure_ascii=False, indent=2)[:2000])
                      break
          elif isinstance(d, list) and d:
              print('list length:', len(d))
              print('first item:', json.dumps(d[0], ensure_ascii=False, indent=2)[:2000])
          PYEOF
          python3 /tmp/summarize_sectors.py

      - name: Also probe GET /market/gainers/ for comparison (same family, may share a sector-per-symbol shape)
        run: |
          curl -sS -H "X-API-Key: $SAHMK_API_KEY" \
            "https://app.sahmk.sa/api/v1/market/gainers/" \
            -o /tmp/gainers.json -w "\nHTTP:%{http_code}\n"
          echo "=== raw body (first 2000 chars) ==="
          head -c 2000 /tmp/gainers.json
