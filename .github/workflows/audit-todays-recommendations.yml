name: Audit Today's Recommendations (temporary, one-shot, read-only, zero SAHMK cost)

on:
  workflow_dispatch:
    inputs:
      audit_date:
        description: "UTC calendar date to audit (YYYY-MM-DD). Leave blank for today (UTC)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Resolve audit date
        id: date
        run: |
          if [ -n "${{ inputs.audit_date }}" ]; then
            echo "audit_date=${{ inputs.audit_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "audit_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit today's recommendations
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          AUDIT_DATE: ${{ steps.date.outputs.audit_date }}
        run: python3 .github/workflows/independent_audit/audit_todays_recommendations.py
