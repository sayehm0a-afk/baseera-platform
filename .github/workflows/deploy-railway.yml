name: Deploy to Railway

# Single idempotent job, workflow_dispatch-only (this touches real paid
# infrastructure with a real credential -- must never run on a plain
# push). Targets an EXISTING Railway project ("Basirah", production
# environment) via a Project Token -- this workflow never creates a
# project (`railway init` does not appear anywhere below) and never
# authenticates with an account/workspace token.
#
# This workflow authenticates with a Project Token (generated inside
# the existing project's own settings, already scoped to that project
# + a specific environment), stored as RAILWAY_TOKEN -- the only
# Railway auth secret this file reads. A project-scoped credential has
# no account-level user identity, so `railway whoami` is not the right
# check for it; `railway status` (scoped to the token's own project)
# is used instead.
#
# A Project Token is already pinned to its one project/environment --
# no `railway link` call is made or needed (a real dispatch showed
# `railway link` itself returns Unauthorized for this token type; it's
# an account-level operation project tokens don't have access to,
# unlike status/add/up/variables/domain, which all work directly).
#
# Idempotency: every resource-creating step (Postgres, Redis, backend
# service, frontend service, public domains) first lists what already
# exists in the project and only creates what's genuinely missing, so
# re-running this workflow is safe and never duplicates the project or
# its services. Real dispatches also showed this CLI's exit code is
# not trustworthy for `railway add` against a Project Token (it can
# exit 1 after actually creating the resource), so creation outcomes
# are re-verified against real Railway state afterward, not trusted
# from the exit code. SECRET_KEY is generated once and never
# regenerated on a rerun (regenerating it would invalidate every
# existing session) -- its presence is checked without ever printing
# variable values, since `railway variable list --json` returns raw
# secret values and must never be echoed to the log.
#
# SECURITY: RAILWAY_TOKEN and SAHMK_API_KEY are read only from GitHub
# Secrets, injected only into the steps that need them, and never
# echoed or logged in any form (no hash, no fingerprint, no partial
# value).

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  RAILWAY_BACKEND_SERVICE: backend
  RAILWAY_FRONTEND_SERVICE: frontend

jobs:
  deploy:
    name: Deploy Basirah to Railway (existing project, Project Token)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose secret presence (never prints values, only presence/length)
        env:
          FROM_SECRETS: ${{ secrets.RAILWAY_TOKEN }}
          SAHMK_FROM_SECRETS: ${{ secrets.SAHMK_API_KEY }}
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref:        ${{ github.ref }} (branch: ${{ github.ref_name }})"
          echo "Actor:      ${{ github.actor }}"
          echo "RAILWAY_TOKEN -- present=$([ -n "$FROM_SECRETS" ] && echo yes || echo no) length=${#FROM_SECRETS}"
          echo "SAHMK_API_KEY -- present=$([ -n "$SAHMK_FROM_SECRETS" ] && echo yes || echo no) length=${#SAHMK_FROM_SECRETS}"

      - name: Fail fast if RAILWAY_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not readable by this job. This workflow expects a Project Token (generated inside the existing Basirah project's own settings), stored under the exact secret name RAILWAY_TOKEN."
            exit 1
          fi
          echo "RAILWAY_TOKEN is present (value not shown)."

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Diagnostics -- capture real CLI command surface for this version
        run: |
          set +e
          railway --version
          echo "--- railway status --help ---"
          railway status --help
          echo "--- railway environment --help ---"
          railway environment --help
          echo "--- railway service --help ---"
          railway service --help
          echo "--- railway domain --help ---"
          railway domain --help
          echo "--- railway variable --help ---"
          railway variable --help
          echo "--- railway link --help ---"
          railway link --help
          set -e

      - name: Verify the Project Token (railway status -- the correct check for a project-scoped token)
        id: project_status
        run: |
          set +e
          railway status --json > /tmp/status.json
          STATUS_EXIT=$?
          set -e
          echo "railway status exit code: $STATUS_EXIT"
          echo "Response (project/environment metadata -- not secret):"
          cat /tmp/status.json
          echo ""
          if [ "$STATUS_EXIT" -ne 0 ]; then
            echo "::error::RAILWAY_TOKEN did not authenticate (railway status failed). This is the correct verification method for a Project Token -- whoami/list are for Account Tokens and do not apply here. The token itself is invalid, revoked, or not scoped the way expected."
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=success" >> "$GITHUB_OUTPUT"
          PROJECT_NAME=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); print(d.get('name','unknown'))" 2>/dev/null || echo unknown)
          PROJECT_ID=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); print(d.get('id','unknown'))" 2>/dev/null || echo unknown)
          ENV_NAME=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); edges=d.get('environments',{}).get('edges',[]); print(edges[0].get('node',{}).get('name','unknown') if edges else 'unknown')" 2>/dev/null || echo unknown)
          echo "Project: $PROJECT_NAME ($PROJECT_ID)"
          echo "Environment: $ENV_NAME"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "environment_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

      - name: List existing services in the linked project (used to avoid creating duplicates)
        id: services
        run: |
          railway service list --json > /tmp/services.json 2>/tmp/services_err.txt || true
          echo "Existing services (names only -- not secret):"
          cat /tmp/services.json 2>/dev/null || cat /tmp/services_err.txt
          echo ""
          PARSE_OK=$(python3 -c "import json; items = json.load(open('/tmp/services.json')); names = [str(x.get('name','')) for x in items] if isinstance(items, list) else [str(k) for k in items.keys()]; open('/tmp/service_names.txt','w').write(chr(10).join(names))" 2>/dev/null && echo yes || echo no)
          if [ "$PARSE_OK" = "yes" ]; then
            HAS_POSTGRES=$(grep -qi postgres /tmp/service_names.txt && echo yes || echo no)
            HAS_REDIS=$(grep -qi redis /tmp/service_names.txt && echo yes || echo no)
            HAS_BACKEND=$(grep -qix backend /tmp/service_names.txt && echo yes || echo no)
            HAS_FRONTEND=$(grep -qix frontend /tmp/service_names.txt && echo yes || echo no)
          else
            HAS_POSTGRES=unknown
            HAS_REDIS=unknown
            HAS_BACKEND=unknown
            HAS_FRONTEND=unknown
          fi
          echo "has_postgres=$HAS_POSTGRES" >> "$GITHUB_OUTPUT"
          echo "has_redis=$HAS_REDIS" >> "$GITHUB_OUTPUT"
          echo "has_backend=$HAS_BACKEND" >> "$GITHUB_OUTPUT"
          echo "has_frontend=$HAS_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Postgres present: $HAS_POSTGRES | Redis present: $HAS_REDIS | backend present: $HAS_BACKEND | frontend present: $HAS_FRONTEND"
          echo "(unknown means parsing the service list failed -- treated as 'exists, do not create' below, to never risk a duplicate; see the raw output above to fix parsing if this happens.)"

      # continue-on-error below: a real dispatch (run 30851746138) showed
      # `railway add --database postgres` actually create the service
      # (confirmed via a fresh `railway status` afterward) while still
      # exiting 1 and printing an unrelated "Project not found" message
      # -- this CLI's exit code is not trustworthy for these commands
      # against a Project Token. The real outcome is re-verified against
      # actual Railway state in the "Re-check" step below instead of
      # trusted from the exit code here.
      - name: Ensure PostgreSQL exists (skip if already present)
        if: steps.services.outputs.has_postgres == 'no'
        continue-on-error: true
        run: railway add --database postgres

      - name: Ensure Redis exists (skip if already present)
        if: steps.services.outputs.has_redis == 'no'
        continue-on-error: true
        run: railway add --database redis

      - name: Ensure backend service exists (skip if already present)
        if: steps.services.outputs.has_backend == 'no'
        continue-on-error: true
        run: railway add --service "$RAILWAY_BACKEND_SERVICE"

      - name: Ensure frontend service exists (skip if already present)
        if: steps.services.outputs.has_frontend == 'no'
        continue-on-error: true
        run: railway add --service "$RAILWAY_FRONTEND_SERVICE"

      - name: Re-check services after creation attempts (authoritative -- exit codes above are not trusted)
        id: services_after
        run: |
          railway service list --json > /tmp/services_after.json 2>/tmp/services_after_err.txt || true
          echo "Services after creation attempts (names only -- not secret):"
          cat /tmp/services_after.json 2>/dev/null || cat /tmp/services_after_err.txt
          echo ""
          python3 -c "import json; items = json.load(open('/tmp/services_after.json')); names = [str(x.get('name','')) for x in items] if isinstance(items, list) else [str(k) for k in items.keys()]; open('/tmp/service_names_after.txt','w').write(chr(10).join(names))" 2>/dev/null
          HAS_POSTGRES=$(grep -qi postgres /tmp/service_names_after.txt 2>/dev/null && echo yes || echo no)
          HAS_REDIS=$(grep -qi redis /tmp/service_names_after.txt 2>/dev/null && echo yes || echo no)
          HAS_BACKEND=$(grep -qix backend /tmp/service_names_after.txt 2>/dev/null && echo yes || echo no)
          HAS_FRONTEND=$(grep -qix frontend /tmp/service_names_after.txt 2>/dev/null && echo yes || echo no)
          echo "Postgres present: $HAS_POSTGRES | Redis present: $HAS_REDIS | backend present: $HAS_BACKEND | frontend present: $HAS_FRONTEND"
          FAIL=0
          [ "$HAS_POSTGRES" = "no" ] && echo "::error::PostgreSQL still does not exist after the creation attempt." && FAIL=1
          [ "$HAS_REDIS" = "no" ] && echo "::error::Redis still does not exist after the creation attempt." && FAIL=1
          [ "$HAS_BACKEND" = "no" ] && echo "::error::backend service still does not exist after the creation attempt." && FAIL=1
          [ "$HAS_FRONTEND" = "no" ] && echo "::error::frontend service still does not exist after the creation attempt." && FAIL=1
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi

      - name: Ensure a public HTTPS domain exists for the backend
        id: backend_domain
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json 2>/dev/null || echo '[]' > /tmp/backend_domains.json
          echo "Existing backend domains:"
          cat /tmp/backend_domains.json
          echo ""
          URL=$(python3 -c "import json; items = json.load(open('/tmp/backend_domains.json')); hosts = [x.get('domain') or x.get('hostname') for x in items] if isinstance(items, list) else []; hosts = [h for h in hosts if h]; print('https://' + hosts[0] if hosts else '')" 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            DOMAIN_OUTPUT=$(railway domain --service "$RAILWAY_BACKEND_SERVICE")
            echo "$DOMAIN_OUTPUT"
            URL=$(echo "$DOMAIN_OUTPUT" | grep -Eo 'https?://[a-zA-Z0-9.-]+' | head -1)
            if [ -z "$URL" ]; then URL=$(echo "$DOMAIN_OUTPUT" | grep -Eo '[a-zA-Z0-9.-]+\.up\.railway\.app' | head -1); URL="https://$URL"; fi
          fi
          echo "Backend URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Ensure a public HTTPS domain exists for the frontend
        id: frontend_domain
        run: |
          railway domain list --service "$RAILWAY_FRONTEND_SERVICE" --json > /tmp/frontend_domains.json 2>/dev/null || echo '[]' > /tmp/frontend_domains.json
          echo "Existing frontend domains:"
          cat /tmp/frontend_domains.json
          echo ""
          URL=$(python3 -c "import json; items = json.load(open('/tmp/frontend_domains.json')); hosts = [x.get('domain') or x.get('hostname') for x in items] if isinstance(items, list) else []; hosts = [h for h in hosts if h]; print('https://' + hosts[0] if hosts else '')" 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            DOMAIN_OUTPUT=$(railway domain --service "$RAILWAY_FRONTEND_SERVICE")
            echo "$DOMAIN_OUTPUT"
            URL=$(echo "$DOMAIN_OUTPUT" | grep -Eo 'https?://[a-zA-Z0-9.-]+' | head -1)
            if [ -z "$URL" ]; then URL=$(echo "$DOMAIN_OUTPUT" | grep -Eo '[a-zA-Z0-9.-]+\.up\.railway\.app' | head -1); URL="https://$URL"; fi
          fi
          echo "Frontend URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Ensure SECRET_KEY exists (generate once, never regenerate -- would invalidate every session)
        id: secret_key
        run: |
          # Never echo the parsed JSON below -- railway variable list --json
          # returns every variable's raw value, including real secrets
          # (SAHMK_API_KEY, DATABASE_URL, an existing SECRET_KEY). Only a
          # yes/no presence result is ever printed.
          railway variable list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_vars.json 2>/dev/null || echo '{}' > /tmp/backend_vars.json
          HAS_KEY=$(python3 -c "import json; d = json.load(open('/tmp/backend_vars.json')); print('yes' if 'SECRET_KEY' in d else 'no')" 2>/dev/null || echo no)
          rm -f /tmp/backend_vars.json
          echo "SECRET_KEY already present on backend service: $HAS_KEY"
          if [ "$HAS_KEY" = "yes" ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "value=$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure backend environment variables
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
          BACKEND_URL: ${{ steps.backend_domain.outputs.url }}
          FRONTEND_URL: ${{ steps.frontend_domain.outputs.url }}
          SECRET_KEY_GENERATED: ${{ steps.secret_key.outputs.generated }}
          SECRET_KEY_VALUE: ${{ steps.secret_key.outputs.value }}
        run: |
          # Railway's cross-service variable reference opener (dollar sign,
          # two open braces) is built at shell runtime, one quoted
          # character at a time -- writing it as one literal token
          # anywhere in this YAML file, even inside a comment, makes
          # GitHub Actions' own expression parser try to evaluate
          # Postgres.DATABASE_URL as one of ITS variables (it isn't;
          # Railway resolves this syntax, not GitHub).
          RAILWAY_REF_OPEN='$'"{{"
          DATABASE_URL_REF="${RAILWAY_REF_OPEN}Postgres.DATABASE_URL}}"
          REDIS_URL_REF="${RAILWAY_REF_OPEN}Redis.REDIS_URL}}"
          SET_ARGS=(
            --set "DATABASE_URL=$DATABASE_URL_REF"
            --set "REDIS_URL=$REDIS_URL_REF"
            --set "BASEERA_ENV=production"
            --set "SAHMK_API_KEY=$SAHMK_API_KEY"
            --set "MARKET_DATA_PROVIDER=sahmk"
            --set "STRICT_REAL_DATA=true"
            --set "ALLOW_SYNTHETIC_DATA=false"
            --set "CORS_ALLOWED_ORIGINS=$FRONTEND_URL"
            --set "TRUSTED_HOSTS=${BACKEND_URL#https://}"
            --set "FRONTEND_BASE_URL=$FRONTEND_URL"
            --set "LIVE_MARKET_MODE_ENABLED=true"
            --set "LIVE_MARKET_MODE_POLL_INTERVAL_SECONDS=60"
            --set "LOG_LEVEL=INFO"
            --set "RATE_LIMIT_ENABLED=true"
            --set "PORT=8000"
          )
          if [ "$SECRET_KEY_GENERATED" = "true" ]; then
            SET_ARGS+=(--set "SECRET_KEY=$SECRET_KEY_VALUE")
          fi
          railway variables --service "$RAILWAY_BACKEND_SERVICE" "${SET_ARGS[@]}"

      - name: Configure frontend environment variables
        env:
          BACKEND_URL: ${{ steps.backend_domain.outputs.url }}
        run: |
          railway variables --service "$RAILWAY_FRONTEND_SERVICE" \
            --set "NEXT_PUBLIC_API_BASE_URL=$BACKEND_URL"

      - name: Deploy backend (from repo root -- picks up ./railway.toml)
        run: railway up --service "$RAILWAY_BACKEND_SERVICE" --detach

      - name: Deploy frontend (from frontend/ -- picks up frontend/railway.toml)
        working-directory: frontend
        run: railway up --service "$RAILWAY_FRONTEND_SERVICE" --detach

      - name: Wait for backend to become healthy
        env:
          BACKEND_URL: ${{ steps.backend_domain.outputs.url }}
        run: |
          echo "Polling $BACKEND_URL/health/live ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "$BACKEND_URL/health/live" || echo "000")
            echo "attempt $i: $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Backend is healthy."; exit 0; fi
            sleep 15
          done
          echo "::error::Backend did not become healthy within the timeout. Railway's own healthcheck-gated rollout means the previous good deployment (if any) is still serving traffic -- see the real build/deploy logs below."
          exit 1

      - name: Dump backend build/deploy logs (only runs if the health wait above failed)
        if: failure()
        run: |
          echo "=== Real service status + replica counts (status/crashed/exited tell us if this is an app crash or an infra scheduling failure) ==="
          railway service list --json > /tmp/services_for_logs.json 2>/dev/null || echo '[]' > /tmp/services_for_logs.json
          PARSED=$(python3 -c "import json; d = json.load(open('/tmp/services_for_logs.json')); items = d if isinstance(d, list) else d.get('services', d.get('edges', [])); matches = [(i.get('node', i) if isinstance(i, dict) else i) for i in items]; matches = [n for n in matches if n.get('name') == 'backend' or n.get('serviceName') == 'backend']; n = matches[0] if matches else {}; dep = n.get('latestDeployment') or {}; print('status:', n.get('status')); print('replicas:', n.get('replicas')); print('deployment_id:', dep.get('id', '')); print('deployment_status:', dep.get('status')); print('DEPLOY_ID=' + dep.get('id', ''))" || echo "DEPLOY_ID=")
          echo "$PARSED"
          DEPLOY_ID=$(echo "$PARSED" | grep '^DEPLOY_ID=' | cut -d= -f2)
          echo "=== Build logs (backend, --build) ==="
          railway logs --service "$RAILWAY_BACKEND_SERVICE" --build 2>&1 | tail -200 || echo "(could not fetch build logs)"
          echo "=== Deploy logs (backend, default) ==="
          railway logs --service "$RAILWAY_BACKEND_SERVICE" 2>&1 | tail -200 || echo "(could not fetch deploy logs)"
          if [ -n "$DEPLOY_ID" ]; then
            echo "=== Deploy logs (backend, --deployment $DEPLOY_ID -- the actual container's runtime stdout/stderr) ==="
            railway logs --service "$RAILWAY_BACKEND_SERVICE" --deployment "$DEPLOY_ID" 2>&1 | tail -300 || echo "(could not fetch deployment-specific logs)"
          fi

      - name: Wait for frontend to become healthy
        env:
          FRONTEND_URL: ${{ steps.frontend_domain.outputs.url }}
        run: |
          echo "Polling $FRONTEND_URL/login ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "$FRONTEND_URL/login" || echo "000")
            echo "attempt $i: $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Frontend is healthy."; exit 0; fi
            sleep 15
          done
          echo "::error::Frontend did not become healthy within the timeout. See the real build/deploy logs below."
          exit 1

      - name: Dump frontend build/deploy logs (only runs if the health wait above failed)
        if: failure()
        run: |
          echo "=== Real service status + replica counts ==="
          railway service list --json > /tmp/services_for_logs_fe.json 2>/dev/null || echo '[]' > /tmp/services_for_logs_fe.json
          PARSED=$(python3 -c "import json; d = json.load(open('/tmp/services_for_logs_fe.json')); items = d if isinstance(d, list) else d.get('services', d.get('edges', [])); matches = [(i.get('node', i) if isinstance(i, dict) else i) for i in items]; matches = [n for n in matches if n.get('name') == 'frontend' or n.get('serviceName') == 'frontend']; n = matches[0] if matches else {}; dep = n.get('latestDeployment') or {}; print('status:', n.get('status')); print('replicas:', n.get('replicas')); print('deployment_id:', dep.get('id', '')); print('deployment_status:', dep.get('status')); print('DEPLOY_ID=' + dep.get('id', ''))" || echo "DEPLOY_ID=")
          echo "$PARSED"
          DEPLOY_ID=$(echo "$PARSED" | grep '^DEPLOY_ID=' | cut -d= -f2)
          echo "=== Build logs (frontend, --build) ==="
          railway logs --service "$RAILWAY_FRONTEND_SERVICE" --build 2>&1 | tail -200 || echo "(could not fetch build logs)"
          echo "=== Deploy logs (frontend, default) ==="
          railway logs --service "$RAILWAY_FRONTEND_SERVICE" 2>&1 | tail -200 || echo "(could not fetch deploy logs)"
          if [ -n "$DEPLOY_ID" ]; then
            echo "=== Deploy logs (frontend, --deployment $DEPLOY_ID -- the actual container's runtime stdout/stderr) ==="
            railway logs --service "$RAILWAY_FRONTEND_SERVICE" --deployment "$DEPLOY_ID" 2>&1 | tail -300 || echo "(could not fetch deployment-specific logs)"
          fi

      - name: Verify PostgreSQL and Redis connectivity (real SELECT 1 / PING via /health/ready)
        env:
          BACKEND_URL: ${{ steps.backend_domain.outputs.url }}
        run: |
          BODY=$(curl -sS --connect-timeout 10 --max-time 20 -w "\n%{http_code}" "$BACKEND_URL/health/ready" || echo -e "\n000")
          HTTP_CODE=$(echo "$BODY" | tail -1)
          JSON=$(echo "$BODY" | sed '$d')
          echo "HTTP $HTTP_CODE"
          echo "$JSON"
          echo "$JSON" > /tmp/ready.json
          DB_OK=$(python3 -c "import json; d=json.load(open('/tmp/ready.json')); print('yes' if d.get('details',{}).get('database') else 'no')" 2>/dev/null || echo unknown)
          REDIS_OK=$(python3 -c "import json; d=json.load(open('/tmp/ready.json')); print('yes' if d.get('details',{}).get('redis') else 'no')" 2>/dev/null || echo unknown)
          echo "PostgreSQL connected (real SELECT 1): $DB_OK"
          echo "Redis connected (real PING):          $REDIS_OK"

      - name: Verify SAHMK connectivity and strict real-data mode (/health/market-data)
        env:
          BACKEND_URL: ${{ steps.backend_domain.outputs.url }}
        run: |
          for i in $(seq 1 6); do
            BODY=$(curl -sS --connect-timeout 10 --max-time 20 -w "\n%{http_code}" "$BACKEND_URL/health/market-data" || echo -e "\n000")
            HTTP_CODE=$(echo "$BODY" | tail -1)
            JSON=$(echo "$BODY" | sed '$d')
            echo "attempt $i -- HTTP $HTTP_CODE"
            echo "$JSON"
            echo "$JSON" > /tmp/market.json
            KIND=$(python3 -c "import json; print(json.load(open('/tmp/market.json')).get('current_provider_kind'))" 2>/dev/null || echo None)
            if [ "$KIND" != "None" ] && [ -n "$KIND" ]; then break; fi
            echo "current_provider_kind not populated yet (live market scheduler has not run its first poll) -- waiting 15s..."
            sleep 15
          done
          echo "$JSON" > /tmp/market_final.json
          python3 -c "import json; d = json.load(open('/tmp/market_final.json')); [print(f'{k}:', d.get(k)) for k in ['configured_provider','strict_real_data','synthetic_allowed','sahmk_key_present','current_provider_kind','last_connectivity_status','last_scan_source','can_publish_recommendations']]" || echo "market-data health check: no valid JSON response received after retries"

      - name: Production smoke test (real HTTP calls against the live URLs)
        env:
          BACKEND_URL: ${{ steps.backend_domain.outputs.url }}
          FRONTEND_URL: ${{ steps.frontend_domain.outputs.url }}
        run: |
          set -e
          echo "=== /health/live ==="
          curl -sS --connect-timeout 10 --max-time 20 -w "\nHTTP %{http_code}\n" "$BACKEND_URL/health/live"
          echo "=== frontend / ==="
          curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" "$FRONTEND_URL/"
          echo "=== frontend /login ==="
          curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" "$FRONTEND_URL/login"
          echo "=== frontend /register ==="
          curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" "$FRONTEND_URL/register"

      - name: Deployment summary
        env:
          BACKEND_URL: ${{ steps.backend_domain.outputs.url }}
          FRONTEND_URL: ${{ steps.frontend_domain.outputs.url }}
        run: |
          echo "======================================================"
          echo " BASIRAH IS LIVE"
          echo "======================================================"
          echo "App URL:     $FRONTEND_URL"
          echo "Backend API: $BACKEND_URL"
          echo "FINAL_APP_URL=$FRONTEND_URL"
