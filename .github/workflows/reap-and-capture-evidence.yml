name: Reap Stale Run and Capture Evidence (temporary, one-shot)

# Run 44 (MarketScanRun) has been orphaned in RUNNING status since
# 2026-08-06T07:11Z, most likely killed mid-scan by a deploy-triggered
# container restart. It never calls finish_run(), so the diagnostic-
# scan route's overlap guard keeps skipping every fresh dispatch
# indefinitely -- blocking evidence capture for the numpy-coercion fix
# (commit 8d8e4d0) even though production is otherwise healthy.
#
# MarketIntelligenceRepository.reap_stale_runs() (existing, tested code
# -- see market_intelligence_repository.py) already runs at the top of
# both POST /market/scan and the diagnostic-scan route, and marks any
# PENDING/RUNNING row older than MARKET_MAX_SCAN_RUN_DURATION_HOURS
# (env-configurable, default 4h) as FAILED. This workflow temporarily
# lowers that threshold to reap run 44 immediately, dispatches one
# diagnostic scan to capture a genuinely fresh, fully-committed
# DecisionV2Snapshot from a run that runs entirely under the fix, then
# restores the default threshold. No new backend code -- reuses the
# existing reaper and diagnostic-scan route exactly as they already
# work; only a temporary env var change.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  reap-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend: $BACKEND_URL"

      - name: Temporarily lower MARKET_MAX_SCAN_RUN_DURATION_HOURS to reap stale runs immediately
        run: |
          railway variables --service "$RAILWAY_BACKEND_SERVICE" --set "MARKET_MAX_SCAN_RUN_DURATION_HOURS=0.01"

      - name: Redeploy backend so it picks up the new variable (same as deploy-railway.yml)
        run: railway up --service "$RAILWAY_BACKEND_SERVICE" --detach

      - name: Wait for backend to become healthy again
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          echo "Polling $BACKEND_URL/health/live ..."
          for i in $(seq 1 20); do
            CODE=$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "$BACKEND_URL/health/live" || echo "000")
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Backend healthy."
              break
            fi
            if [ "$i" = "20" ]; then
              echo "::error::Backend did not become healthy in time."
              exit 1
            fi
            sleep 5
          done

      - name: Log in as the staff account
        id: login
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Login as the staff account failed."
            exit 1
          fi
          CSRF=$(grep -i csrf_token /tmp/cookies.txt | awk '{print $NF}')
          echo "$CSRF" > /tmp/.csrf

      - name: Trigger a fresh diagnostic scan (reaps run 44, then runs a clean scan)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          CSRF=$(cat /tmp/.csrf)
          curl -sS --connect-timeout 10 --max-time 120 -b /tmp/cookies.txt \
            -X POST "$BACKEND_URL/api/v1/admin/market-intelligence/diagnostic-scan" \
            -H "Content-Type: application/json" \
            -H "x-csrf-token: $CSRF" \
            -d '{}' \
            -o /tmp/diagnostic.json -w "\nHTTP %{http_code}\n"
          echo "=== Diagnostic scan result (post-fix, post-reap) ==="
          python3 -m json.tool /tmp/diagnostic.json

      - name: Restore MARKET_MAX_SCAN_RUN_DURATION_HOURS to its default (4h)
        if: always()
        run: |
          railway variables --service "$RAILWAY_BACKEND_SERVICE" --set "MARKET_MAX_SCAN_RUN_DURATION_HOURS=4"
          railway up --service "$RAILWAY_BACKEND_SERVICE" --detach

      - name: Clean up local session artifacts
        if: always()
        run: rm -f /tmp/.csrf /tmp/cookies.txt /tmp/login_body.json /tmp/diagnostic.json
