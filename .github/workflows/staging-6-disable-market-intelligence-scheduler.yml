name: Staging PR#114 - 6. Disable MarketIntelligenceScheduler (RAILWAY_STAGING_TOKEN only, reverses step 5)

# Reverses staging-5-enable-market-intelligence-scheduler.yml: sets
# MARKET_INTELLIGENCE_SCHEDULER_ENABLED=false (its pre-activation
# default) and leaves MARKET_INTELLIGENCE_SCAN_INTERVAL unset again.
# Does NOT remove or disable the scheduler's code in any way -- only
# this one flag on the isolated staging backend service. No production
# access (secrets.RAILWAY_TOKEN is never read here -- only
# secrets.RAILWAY_STAGING_TOKEN).

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  EXPECTED_STAGING_PROJECT_ID: "7b3a7f9f-66da-460a-ba3e-9ca251f142f7"
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
    steps:
      - name: Fail fast if RAILWAY_STAGING_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_STAGING_TOKEN is not readable by this job."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: HARD GATE -- re-verify this token resolves to the expected staging project
        run: |
          set +e
          railway status --json > /tmp/status.json
          STATUS_EXIT=$?
          set -e
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/status.json')).get('id','unknown'))" 2>/dev/null || echo unknown)
          if [ "$STATUS_EXIT" -ne 0 ] || [ "$PROJECT_ID" != "$EXPECTED_STAGING_PROJECT_ID" ]; then
            echo "::error::Token does not resolve to the expected staging project ($PROJECT_ID != $EXPECTED_STAGING_PROJECT_ID). Refusing to change any variable."
            exit 1
          fi
          echo "CONFIRMED staging project ($EXPECTED_STAGING_PROJECT_ID). Proceeding."

      - name: Confirm current state (before)
        run: |
          railway variable list --service "$RAILWAY_BACKEND_SERVICE" --kv 2>/dev/null \
            | grep -iE "MARKET_INTELLIGENCE_SCHEDULER_ENABLED|MARKET_INTELLIGENCE_SCAN_INTERVAL"

      - name: Set MARKET_INTELLIGENCE_SCHEDULER_ENABLED=false (triggers a redeploy)
        run: |
          railway variables --service "$RAILWAY_BACKEND_SERVICE" \
            --set "MARKET_INTELLIGENCE_SCHEDULER_ENABLED=false"

      - name: Confirm the variable is now set
        run: |
          railway variable list --service "$RAILWAY_BACKEND_SERVICE" --kv 2>/dev/null \
            | grep -iE "MARKET_INTELLIGENCE_SCHEDULER_ENABLED|MARKET_INTELLIGENCE_SCAN_INTERVAL"

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Wait for backend to become healthy again after the redeploy
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          echo "Polling $BACKEND_URL/health/live ..."
          for i in $(seq 1 20); do
            STATUS=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "$BACKEND_URL/health/live" || echo "000")
            echo "attempt $i: $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Backend is healthy."; exit 0; fi
            sleep 15
          done
          echo "::error::Backend did not become healthy within the timeout after setting the variable."
          exit 1

      - name: Confirm application health (DB/Redis) after the restart
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 "$BACKEND_URL/health/ready" -w "\nHTTP %{http_code}\n"
