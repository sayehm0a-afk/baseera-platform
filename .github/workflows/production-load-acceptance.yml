name: Production Load & Concurrency Acceptance

# M9 §1: a SAFE, read-only concurrency acceptance test against the
# already-deployed Basirah backend/frontend on Railway. This measures
# whether the platform holds up under multiple simultaneous users --
# it does not create/modify Railway infrastructure, and it never calls
# a route that can trigger a live SAHMK request (diagnostic-scan,
# full-discovery, etc. are all deliberately excluded), so it cannot
# consume SAHMK quota no matter how it is scheduled or re-run.
#
# Every target below is either a static/SSR frontend page or a
# backend route that reads from Postgres/Redis only (confirmed by
# reading the route source before adding it here -- see
# src/api/routes/market.py, main.py's /health/live). No mutating
# (POST/PUT/DELETE) route is included.
#
# Concurrency is generated by a single Python asyncio+aiohttp client
# (stdlib-adjacent, no new heavy dependency, matches this repo's
# existing convention of plain python3 in every other production
# workflow rather than introducing k6/locust/artillery -- see
# tests/load/test_load_validation.py's own comment that real API load
# testing was deferred to "production, use tools like ... k6" -- this
# workflow is that deferred piece, built the same way the rest of this
# repo's production tooling already is).

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Simultaneous virtual users per target"
        required: false
        default: "15"
      requests_per_user:
        description: "Sequential requests each virtual user sends"
        required: false
        default: "5"

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend
  RAILWAY_FRONTEND_SERVICE: frontend

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
      CONCURRENCY: ${{ github.event.inputs.concurrency }}
      REQUESTS_PER_USER: ${{ github.event.inputs.requests_per_user }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail fast if required secrets are not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set."
            exit 1
          fi
          if [ -z "$STAFF_EMAIL" ] || [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::STAFF_EMAIL/STAFF_PASSWORD are not set."
            exit 1
          fi

      - name: Install Railway CLI + aiohttp
        run: |
          npm install -g @railway/cli
          pip install --quiet aiohttp

      - name: Resolve backend/frontend public URLs
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          railway domain list --service "$RAILWAY_FRONTEND_SERVICE" --json > /tmp/frontend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          FRONTEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/frontend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend:  $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"

      - name: Confirm backend/frontend healthy before generating any load
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -w "\nHTTP %{http_code}\n" "$BACKEND_URL/health/ready"
          curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "frontend / -> HTTP %{http_code}\n" "$FRONTEND_URL/"

      - name: Log in as the staff account (for the authenticated-traffic slice)
        id: login
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Staff login failed with HTTP $HTTP_CODE -- authenticated-traffic slice cannot run."
            exit 1
          fi
          ACCESS_COOKIE=$(grep -i 'access_token' /tmp/cookies.txt | awk '{print $NF}')
          echo "access_cookie=$ACCESS_COOKIE" >> "$GITHUB_OUTPUT"

      - name: Run concurrent read-only load test
        id: load
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
          ACCESS_COOKIE: ${{ steps.login.outputs.access_cookie }}
        run: |
          python3 - <<'PYEOF'
          import asyncio
          import json
          import os
          import statistics
          import time

          import aiohttp

          BACKEND = os.environ["BACKEND_URL"]
          FRONTEND = os.environ["FRONTEND_URL"]
          ACCESS_COOKIE = os.environ.get("ACCESS_COOKIE", "")
          CONCURRENCY = int(os.environ.get("CONCURRENCY", "15") or "15")
          REQUESTS_PER_USER = int(os.environ.get("REQUESTS_PER_USER", "5") or "5")

          # Every target is a read-only, non-SAHMK-triggering route --
          # confirmed by reading its handler before listing it here.
          # /api/v1/market/{summary,rankings,sectors,alerts,status} all
          # require require_active_subscription() (see
          # src/api/routes/market.py) -- a first real run of this
          # workflow (2026-08-12) proved this the hard way: they were
          # originally listed here as unauthenticated and every one of
          # the 375 calls correctly came back 401, which is the
          # platform behaving exactly as designed, not a defect. Moved
          # to AUTH_TARGETS below.
          UNAUTH_TARGETS = [
              ("frontend", "landing", f"{FRONTEND}/"),
              ("frontend", "login_page", f"{FRONTEND}/login"),
              ("frontend", "register_page", f"{FRONTEND}/register"),
              ("backend", "health_live", f"{BACKEND}/health/live"),
          ]
          AUTH_TARGETS = [
              ("frontend", "dashboard", f"{FRONTEND}/dashboard"),
              ("frontend", "opportunities", f"{FRONTEND}/opportunities"),
              ("frontend", "scan", f"{FRONTEND}/scan"),
              ("frontend", "watchlist", f"{FRONTEND}/watchlist"),
              ("frontend", "reports", f"{FRONTEND}/reports"),
              ("frontend", "more", f"{FRONTEND}/more"),
              ("backend", "watchlist_api", f"{BACKEND}/api/v1/watchlist"),
              ("backend", "market_summary", f"{BACKEND}/api/v1/market/summary"),
              ("backend", "market_rankings", f"{BACKEND}/api/v1/market/rankings"),
              ("backend", "market_sectors", f"{BACKEND}/api/v1/market/sectors"),
              ("backend", "market_alerts", f"{BACKEND}/api/v1/market/alerts"),
              ("backend", "market_status", f"{BACKEND}/api/v1/market/status"),
          ]

          results = []

          async def one_request(session, category, name, url):
              start = time.monotonic()
              try:
                  async with session.get(url, timeout=aiohttp.ClientTimeout(total=15)) as resp:
                      await resp.read()
                      elapsed = (time.monotonic() - start) * 1000
                      results.append((category, name, resp.status, elapsed, None))
              except asyncio.TimeoutError:
                  elapsed = (time.monotonic() - start) * 1000
                  results.append((category, name, None, elapsed, "timeout"))
              except Exception as exc:  # noqa: BLE001 -- load test must record, never crash, on any client-side error
                  elapsed = (time.monotonic() - start) * 1000
                  results.append((category, name, None, elapsed, type(exc).__name__))

          async def virtual_user(session, targets, user_id):
              for _ in range(REQUESTS_PER_USER):
                  for category, name, url in targets:
                      await one_request(session, category, name, url)

          async def run_slice(targets, cookies, label):
              connector = aiohttp.TCPConnector(limit=CONCURRENCY * 2)
              async with aiohttp.ClientSession(connector=connector, cookies=cookies) as session:
                  start = time.monotonic()
                  await asyncio.gather(*[virtual_user(session, targets, i) for i in range(CONCURRENCY)])
                  wall_seconds = time.monotonic() - start
              print(f"\n=== {label}: wall clock {wall_seconds:.2f}s for {CONCURRENCY} virtual users x "
                    f"{REQUESTS_PER_USER} rounds x {len(targets)} targets ===")
              return wall_seconds

          async def main():
              unauth_wall = await run_slice(UNAUTH_TARGETS, None, "Unauthenticated traffic")
              cookies = {"access_token": ACCESS_COOKIE} if ACCESS_COOKIE else None
              auth_wall = await run_slice(AUTH_TARGETS, cookies, "Authenticated (staff) traffic")
              return unauth_wall + auth_wall

          total_wall = asyncio.run(main())

          total_requests = len(results)
          durations = [r[3] for r in results]
          statuses = {}
          errors = {}
          for category, name, status, elapsed, error in results:
              key = status if status is not None else f"CLIENT_ERROR:{error}"
              statuses[key] = statuses.get(key, 0) + 1
              if error:
                  errors[error] = errors.get(error, 0) + 1

          success = sum(v for k, v in statuses.items() if isinstance(k, int) and 200 <= k < 400)
          server_errors = sum(v for k, v in statuses.items() if isinstance(k, int) and k >= 500)
          timeouts = errors.get("timeout", 0)

          durations_sorted = sorted(durations)

          def pct(p):
              if not durations_sorted:
                  return None
              idx = min(len(durations_sorted) - 1, int(len(durations_sorted) * p / 100))
              return durations_sorted[idx]

          summary = {
              "concurrency": CONCURRENCY,
              "requests_per_user": REQUESTS_PER_USER,
              "total_requests": total_requests,
              "total_wall_seconds": round(total_wall, 2),
              "requests_per_second": round(total_requests / total_wall, 2) if total_wall else None,
              "success_count": success,
              "success_rate_pct": round(100 * success / total_requests, 2) if total_requests else None,
              "server_error_5xx_count": server_errors,
              "timeout_count": timeouts,
              "status_distribution": {str(k): v for k, v in sorted(statuses.items(), key=lambda kv: str(kv[0]))},
              "client_error_breakdown": errors,
              "latency_ms": {
                  "min": round(min(durations), 1) if durations else None,
                  "p50": round(pct(50), 1) if durations else None,
                  "p95": round(pct(95), 1) if durations else None,
                  "p99": round(pct(99), 1) if durations else None,
                  "max": round(max(durations), 1) if durations else None,
                  "mean": round(statistics.mean(durations), 1) if durations else None,
              },
          }

          per_endpoint = {}
          for category, name, status, elapsed, error in results:
              key = f"{category}:{name}"
              per_endpoint.setdefault(key, {"count": 0, "success": 0, "5xx": 0, "durations": []})
              per_endpoint[key]["count"] += 1
              per_endpoint[key]["durations"].append(elapsed)
              if status is not None and 200 <= status < 400:
                  per_endpoint[key]["success"] += 1
              if status is not None and status >= 500:
                  per_endpoint[key]["5xx"] += 1
          per_endpoint_summary = {}
          for key, v in per_endpoint.items():
              d = sorted(v["durations"])
              per_endpoint_summary[key] = {
                  "count": v["count"],
                  "success_rate_pct": round(100 * v["success"] / v["count"], 1),
                  "5xx_count": v["5xx"],
                  "p50_ms": round(d[len(d) // 2], 1),
                  "p95_ms": round(d[int(len(d) * 0.95) if len(d) > 1 else 0], 1),
              }
          summary["per_endpoint"] = per_endpoint_summary

          print("\n=== LOAD TEST SUMMARY (JSON) ===")
          print(json.dumps(summary, indent=2))

          with open("/tmp/load_summary.json", "w") as f:
              json.dump(summary, f, indent=2)

          # Fail the job only on a catastrophic signal -- this workflow's
          # purpose is to MEASURE and report real numbers, the same
          # non-blocking-on-findings spirit as production-ux-audit.yml.
          # A high error rate is a genuine defect signal worth a red
          # job; a single flaky request among hundreds is not.
          if total_requests == 0:
              print("::error::No requests completed at all.")
              raise SystemExit(1)
          error_rate = 1 - (success / total_requests)
          if error_rate > 0.10:
              print(f"::error::Error rate {error_rate:.1%} exceeds the 10% acceptance threshold.")
              raise SystemExit(1)
          print(f"\nError rate {error_rate:.1%} within acceptance threshold; job passes.")
          PYEOF

      - name: Re-check backend health immediately after the load test
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -w "\nHTTP %{http_code}\n" "$BACKEND_URL/health/ready"

      - name: Upload load test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-load-acceptance-evidence
          path: /tmp/load_summary.json
          retention-days: 30

      - name: Clean up local session artifacts
        if: always()
        run: |
          rm -f /tmp/cookies.txt /tmp/login_body.json
