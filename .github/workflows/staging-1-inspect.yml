name: Staging PR#114 - 1. Inspect (read-only, RAILWAY_STAGING_TOKEN only)

# Part 1 of 3 of the PR #114 controlled staging validation
# (docs/governance/staging-deployment-plan-pr114.md). READ-ONLY: this
# workflow creates or modifies nothing. It exists purely to answer,
# with real evidence, two questions before any billable resource is
# touched:
#   1. Does RAILWAY_STAGING_TOKEN actually authenticate against the
#      new baseera-platform-staging project
#      (7b3a7f9f-66da-460a-ba3e-9ca251f142f7), and NOT production?
#   2. What already exists in that project right now (in particular,
#      the "appealing-vitality" service and "Apply 1 change" the user
#      saw while setting it up)?
#
# This workflow NEVER reads secrets.RAILWAY_TOKEN (the production
# Project Token) -- only secrets.RAILWAY_STAGING_TOKEN. If that secret
# is missing or resolves to any project other than the expected ID,
# every following step is skipped and the job fails loudly.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  EXPECTED_STAGING_PROJECT_ID: "7b3a7f9f-66da-460a-ba3e-9ca251f142f7"

jobs:
  inspect:
    name: Inspect baseera-platform-staging (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
    steps:
      - name: Fail fast if RAILWAY_STAGING_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_STAGING_TOKEN is not readable by this job. Add it as a repository secret (the Project Token generated inside baseera-platform-staging's own settings) before running this workflow."
            exit 1
          fi
          echo "RAILWAY_STAGING_TOKEN is present (value never shown)."

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify this token resolves to the expected STAGING project ID (hard gate)
        id: project_check
        run: |
          set +e
          railway status --json > /tmp/status.json
          STATUS_EXIT=$?
          set -e
          echo "railway status exit code: $STATUS_EXIT"
          cat /tmp/status.json
          echo ""
          if [ "$STATUS_EXIT" -ne 0 ]; then
            echo "::error::RAILWAY_STAGING_TOKEN did not authenticate. It may be invalid, revoked, or not a Project Token."
            exit 1
          fi
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/status.json')).get('id','unknown'))")
          PROJECT_NAME=$(python3 -c "import json; print(json.load(open('/tmp/status.json')).get('name','unknown'))")
          ENV_NAME=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); edges=d.get('environments',{}).get('edges',[]); print(edges[0].get('node',{}).get('name','unknown') if edges else 'unknown')" 2>/dev/null || echo unknown)
          echo "Resolved project: $PROJECT_NAME ($PROJECT_ID)"
          echo "Resolved environment: $ENV_NAME"
          if [ "$PROJECT_ID" != "$EXPECTED_STAGING_PROJECT_ID" ]; then
            echo "::error::RAILWAY_STAGING_TOKEN resolves to project '$PROJECT_ID' ($PROJECT_NAME), NOT the expected staging project '$EXPECTED_STAGING_PROJECT_ID'. Refusing to proceed -- this could be production or an unrelated project. STOP and investigate before running any other staging workflow."
            exit 1
          fi
          echo "CONFIRMED: this token is scoped to the expected staging project ($EXPECTED_STAGING_PROJECT_ID)."
          echo "environment_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

      - name: List every service currently in the staging project
        run: |
          railway service list --json > /tmp/services.json 2>/tmp/services_err.txt || true
          echo "=== Raw service list (names/ids/status -- not secret) ==="
          cat /tmp/services.json 2>/dev/null || cat /tmp/services_err.txt
          echo ""
          echo "=== Parsed summary ==="
          python3 - <<'PYEOF'
          import json
          try:
              items = json.load(open('/tmp/services.json'))
          except Exception as e:
              print(f"Could not parse service list: {e}")
              raise SystemExit(0)
          if isinstance(items, dict):
              items = items.get('services', items.get('edges', []))
          for it in items:
              node = it.get('node', it) if isinstance(it, dict) else it
              print(f"- name={node.get('name')!r} id={node.get('id')!r} status={node.get('status') or node.get('deploymentStatus')!r}")
          PYEOF

      - name: Inspect the "appealing-vitality" service specifically (or any auto-named service)
        run: |
          railway service list --json > /tmp/services2.json 2>/dev/null || echo '[]' > /tmp/services2.json
          python3 - <<'PYEOF'
          import json
          try:
              items = json.load(open('/tmp/services2.json'))
          except Exception:
              items = []
          if isinstance(items, dict):
              items = items.get('services', items.get('edges', []))
          found = False
          for it in items:
              node = it.get('node', it) if isinstance(it, dict) else it
              name = str(node.get('name', ''))
              if 'appeal' in name.lower() or 'vitality' in name.lower():
                  found = True
                  print("=== Matched service (full non-secret metadata) ===")
                  print(json.dumps(node, indent=2, default=str))
          if not found:
              print("No service matching 'appealing-vitality' found in the current listing above -- it may have been a transient dashboard-only draft, or already resolved/renamed. Re-check the Railway dashboard directly if this is unexpected.")
          PYEOF

      - name: List environment variables present per service (names only -- never values)
        run: |
          for svc in backend frontend Postgres Redis; do
            echo "=== $svc ==="
            railway variable list --service "$svc" --json > /tmp/vars_$svc.json 2>/dev/null || { echo "(service '$svc' not found or no variables yet)"; continue; }
            python3 -c "import json; d=json.load(open('/tmp/vars_$svc.json')); print('variable names:', sorted(d.keys()) if isinstance(d, dict) else d)" 2>/dev/null || echo "(could not parse)"
            rm -f /tmp/vars_$svc.json
          done

      - name: Transparent cost estimate for a 48-hour validation window (public pricing, NOT a live billing quote)
        run: |
          python3 - <<'PYEOF'
          # Public Railway pricing (checked 2026-09): ~$20/vCPU-month,
          # ~$10/GB RAM-month, storage ~$0.15/GB, egress ~$0.05/GB.
          # Assumes 4 light services (backend, frontend, Postgres,
          # Redis), each averaging well under 0.5 vCPU / 512MB under a
          # near-idle validation workload (no schedulers, no SAHMK
          # calls, only manual login/rate-limit-test traffic), for a
          # 48-hour window (48/730 of a month).
          hours = 48
          month_hours = 730
          fraction = hours / month_hours
          vcpu_month = 20.0
          ram_gb_month = 10.0
          services = 4
          assumed_vcpu_per_service = 0.5
          assumed_ram_gb_per_service = 0.5
          compute_cost = services * assumed_vcpu_per_service * vcpu_month * fraction
          ram_cost = services * assumed_ram_gb_per_service * ram_gb_month * fraction
          storage_cost_estimate = 0.30  # small Postgres+Redis volumes for a couple of days
          total = compute_cost + ram_cost + storage_cost_estimate
          print(f"Estimated cost for a {hours}-hour validation window: ${total:.2f}")
          print(f"  compute: ${compute_cost:.2f}  memory: ${ram_cost:.2f}  storage (est.): ${storage_cost_estimate:.2f}")
          print("This is a public-pricing-based ESTIMATE, not a live Railway billing quote (no billing API was queried).")
          budget = 5.0
          if total > budget:
              print(f"::error::Estimated cost ${total:.2f} EXCEEDS the ${budget:.2f} target budget. STOP before creating any resource.")
              raise SystemExit(1)
          print(f"Estimated cost is within the ${budget:.2f} target budget.")
          PYEOF
