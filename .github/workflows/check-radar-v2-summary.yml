name: Check Radar V2 Summary (temporary, one-shot, read-only, zero SAHMK cost)

# Real-market validation audit (numpy float64 fix, PR #59): confirms
# whether RadarOpportunity rows now actually get persisted after a
# scheduler cycle, via the one already-existing read-only route
# (GET .../radar-v2/summary -- a DB-only read, never a live provider
# call). Makes zero SAHMK requests; does not trigger a scan.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Log in as the staff account
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Login as the staff account failed."
            exit 1
          fi

      - name: GET radar-v2/summary
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt "$BACKEND_URL/api/v1/admin/market-intelligence/radar-v2/summary" -o /tmp/radar_summary.json
          echo "=== radar-v2/summary ==="
          python3 -m json.tool /tmp/radar_summary.json

      - name: GET radar-v2/opportunities (top rows)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt "$BACKEND_URL/api/v1/admin/market-intelligence/radar-v2/opportunities?limit=10" -o /tmp/radar_opps.json
          echo "=== radar-v2/opportunities (top 10) ==="
          python3 -m json.tool /tmp/radar_opps.json

      - name: Clean up local session artifacts
        if: always()
        run: rm -f /tmp/cookies.txt /tmp/login_body.json /tmp/radar_summary.json /tmp/radar_opps.json
