name: Continue Full Market Scan (approved continuation rotation, real SAHMK)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Full deployed commit SHA to verify before running (abort if mismatch). Leave empty to skip the check."
        required: false
        default: ""
      max_cycles:
        description: "Hard safety cap on number of continue-scan-cycle calls this run."
        required: false
        default: "40"
      time_budget_seconds:
        description: "Wall-clock budget for the continuation loop, in seconds."
        required: false
        default: "3000"
      baseline_already_scanned:
        description: "Symbols already scanned today outside this script (e.g. run 116) to add to the coverage count."
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  continue-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_BACKEND_SERVICE: backend
    steps:
      - uses: actions/checkout@v4

      - run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Run continuation rotation
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          EXPECTED_COMMIT: ${{ github.event.inputs.expected_commit }}
          MAX_CYCLES: ${{ github.event.inputs.max_cycles }}
          TIME_BUDGET_SECONDS: ${{ github.event.inputs.time_budget_seconds }}
          BASELINE_ALREADY_SCANNED: ${{ github.event.inputs.baseline_already_scanned }}
          EVIDENCE_FILE: /tmp/continue_scan_evidence.json
        run: python3 .github/workflows/independent_audit/continue_full_market_scan.py

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continue-full-market-scan-evidence
          path: /tmp/continue_scan_evidence.json
          retention-days: 14
