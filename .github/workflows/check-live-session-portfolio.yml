name: Check Live Session + Portfolio (temporary, one-shot, read-only, zero SAHMK cost)

# VAL-7 real-market validation audit: exercises a real authenticated
# session end-to-end against production -- login cookie security
# flags, portfolio list (DB-only), and market/status -- to confirm
# the live user session actually works, not just that its code
# compiles/passes unit tests. No route here makes a live SAHMK call
# (portfolio list and market/status are both DB/cache-backed reads).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Log in and exercise a live session against portfolio + market/status
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          python3 - <<'PYEOF'
          import os
          import requests

          backend_url = os.environ["BACKEND_URL"].rstrip("/")
          session = requests.Session()
          r = session.post(
              f"{backend_url}/api/v1/auth/login",
              json={"email": os.environ["STAFF_EMAIL"], "password": os.environ["STAFF_PASSWORD"]},
              timeout=30,
          )
          r.raise_for_status()

          print("=== login response cookies ===")
          for c in r.cookies:
              print(f"  {c.name}: httponly={c.has_nonstandard_attr('HttpOnly') or getattr(c, '_rest', {}).get('HttpOnly')} "
                    f"secure={c.secure} samesite={getattr(c, '_rest', {}).get('SameSite')}")

          csrf = session.cookies.get("csrf_token")
          if csrf:
              session.headers.update({"X-CSRF-Token": csrf})

          print("\n=== portfolio list ===")
          resp = session.get(f"{backend_url}/api/v1/portfolio", timeout=30)
          print(f"HTTP {resp.status_code}")
          print(resp.json())

          print("\n=== market/status ===")
          resp = session.get(f"{backend_url}/api/v1/market/status", timeout=30)
          print(f"HTTP {resp.status_code}")
          print(resp.json())

          print("\n=== auth/me ===")
          resp = session.get(f"{backend_url}/api/v1/auth/me", timeout=30)
          print(f"HTTP {resp.status_code}")
          print(resp.json())
          PYEOF
