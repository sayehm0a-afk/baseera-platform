name: CI

# M0 build-stability gate. Scope is intentionally narrow: prove the
# repository installs, imports, compiles, and its existing tests run in a
# clean environment. It does not validate application behavior beyond
# that -- see docs/architecture/m0-build-status.md for what is and is not
# covered.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# `workflow_dispatch` above: lets a specific commit's checks be fired
# deterministically from the Actions UI/API without needing a new
# push -- also what surfaced the actual root cause of PR #17's
# mysterious "event: push, 0 jobs, conclusion: failure" runs on
# commits d0c36ac/ebab35e: `jobs.<job_id>.env` (below, at the time)
# referenced `${{ runner.temp }}`, but the `runner` context is not
# available at that position (only within `steps` -- see "Context
# availability" in GitHub's own Actions docs). `push`/`pull_request`
# events apparently degrade this specific parse failure into a
# 0-job "failure" run with no visible error anywhere in the job logs
# (because there are no job logs -- the run never got past
# scheduling); `workflow_dispatch`'s API returned the exact error
# outright ("Unrecognized named-value: 'runner'"), which is what
# actually diagnosed it. Fixed by setting LOG_DIR from a step (see
# "Configure LOG_DIR" below) using the plain `$RUNNER_TEMP` shell
# environment variable instead, which needs no `${{ }}` context
# expression at all.

# Pre-existing repo-wide flake8 violation count as of the M0 milestone,
# recorded so new violations are blocked without requiring an immediate
# repo-wide reformat (out of M0/M1 scope -- see the planned M1.5 "Lint
# Debt Reduction" milestone in docs/architecture/current-status.md and
# the M1 PR description). Recompute locally with:
#   flake8 src/ tests/ main.py --count
#
# ANY CHANGE TO THIS NUMBER REQUIRES EXPLICIT HUMAN REVIEW. This value is
# a real merge gate: raising it silently (in the same PR that adds the
# violations it's meant to block) defeats the gate entirely. This file is
# listed in CODEOWNERS specifically so changes to it are flagged for
# review -- that only auto-requests a reviewer, it does not by itself
# block merging; blocking requires this repository's branch protection to
# additionally require CODEOWNERS review, which is a GitHub repository
# setting this workflow file cannot configure or verify from here.
# Lower this value only when deliberately reducing debt (M1.5), never to
# silence a regression.
env:
  FLAKE8_BASELINE: 0

jobs:
  build-and-test:
    name: Install, compile, test, lint, boot
    runs-on: ubuntu-latest
    # Real Redis, matching docker-compose.yml's own `redis:6-alpine` --
    # most Redis-dependent tests already skip gracefully when Redis is
    # unavailable (see e.g. tests/unit/auth/test_token_store.py), but a
    # few (tests/integration/api/test_admin_routes.py's session-revoke
    # tests) call the real client unconditionally and hard-fail with
    # `redis.exceptions.ConnectionError` instead of skipping when there
    # is nothing at localhost:6379 to connect to. Settings' own
    # defaults (redis_host=localhost, redis_port=6379 --
    # src/core/config/settings.py) already match a service container
    # mapped this way, so no extra env var is needed here. This also
    # means every other Redis-conditional test in the suite runs for
    # real in CI instead of skipping, which is a real coverage gain,
    # not just a fix for these 3.
    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Every unit/integration test still runs against SQLite (see each
      # test's own fixture) -- this service exists for one specific,
      # narrower purpose: the "Apply migrations to a real Postgres"
      # step below. Found in the pre-live-scan production audit: the
      # full migration chain, and known SQLite-vs-Postgres divergences
      # (numpy.float64 literal rendering, Numeric/JSON column
      # behavior -- see MarketIntelligenceRepository's own `_f()`
      # helper) were previously never verified against a real Postgres
      # engine anywhere in CI, only asserted safe by migration-file
      # inspection and a SQLite-backed replay test. This does not make
      # CI a full Postgres-backed test run (a larger, separate
      # initiative); it closes the specific gap that most directly
      # risked the live scan: a migration that applies cleanly to
      # SQLite but fails or behaves differently against real Postgres.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: basirah_ci_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub-hosted runners execute as a non-root `runner` user with
      # no write access to /var/log (structured_logging.py's
      # production default, LOG_DIR unset). Point logging at the job's
      # own writable scratch directory instead -- $RUNNER_TEMP is a
      # plain shell environment variable the runner always provides
      # (no `${{ }}` expression/context needed, unlike the `runner`
      # context object which is NOT available in `jobs.<job_id>.env` --
      # see this file's top-of-file comment for how that exact mistake
      # broke CI for two commits on PR #17), and is cleaned up
      # automatically after the job. Writing to $GITHUB_ENV makes this
      # a job-wide env var for every later step. structured_logging.py
      # also falls back on its own if this were ever unset/wrong (see
      # _ensure_writable_log_dir), but setting it explicitly here means
      # CI logs land somewhere predictable rather than relying on that
      # fallback path.
      - name: Configure LOG_DIR
        run: echo "LOG_DIR=${RUNNER_TEMP}/basirah-logs" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies (clean environment)
        run: pip install -r requirements.txt

      - name: Install package in editable mode
        run: pip install -e . --no-deps

      - name: Compile check (all Python source files)
        run: |
          set -e
          FAILED=0
          find src tests -name '*.py' -not -name '*.cover' > /tmp/pyfiles.txt
          echo "main.py" >> /tmp/pyfiles.txt
          while read -r f; do
            if ! python -m py_compile "$f"; then
              echo "SYNTAX ERROR: $f"
              FAILED=1
            fi
          done < /tmp/pyfiles.txt
          if [ "$FAILED" -ne 0 ]; then
            echo "Compile check failed."
            exit 1
          fi
          echo "Compile check passed: all source files compile cleanly."

      - name: Application boot smoke test (import main.py)
        run: |
          python -c "
          import main
          print('main.py imported successfully')
          print('Routes registered:', len(main.app.routes))
          "

      - name: Test collection check
        run: python -m pytest tests/ --collect-only -q

      - name: Run test suite
        run: python -m pytest tests/ -q -rA

      - name: Apply migrations to a real Postgres (real engine, not SQLite)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/basirah_ci_migration_check
        run: python -m alembic upgrade head

      - name: Downgrade and re-upgrade the full migration chain on Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/basirah_ci_migration_check
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Lint (flake8, regression gate against documented baseline)
        run: |
          set -e
          COUNT=$(python -m flake8 src/ tests/ main.py --count | tail -1)
          echo "flake8 violation count: $COUNT (baseline: $FLAKE8_BASELINE)"
          if [ "$COUNT" -gt "$FLAKE8_BASELINE" ]; then
            echo "flake8 violations increased ($COUNT > $FLAKE8_BASELINE). New code must not add lint debt."
            exit 1
          fi
          echo "flake8 gate passed (pre-existing debt tracked in docs/architecture/m0-build-status.md, not silenced)."

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  refresh-rotation-concurrency-proof:
    name: Refresh-rotation concurrency proof (real Postgres+Redis, must not skip)
    runs-on: ubuntu-latest
    # tests/integration/test_refresh_rotation_concurrency.py proves two
    # properties of consume_refresh_session's row-level locking (exactly-
    # one-winner under a real race, and family-scoped revocation
    # isolation) against genuine PostgreSQL + Redis, and skips cleanly
    # (pytest.mark.skipif) rather than silently passing when either is
    # unreachable. The build-and-test job above's "Run test suite" step
    # runs the whole tree with no DATABASE_URL override, so
    # settings.database_url falls back to its own default --
    # postgresql://postgres:postgres@localhost:5432/basirah -- which
    # points at a database that is never created there (that job only
    # creates "basirah_ci_migration_check", and only for its later,
    # separate migration-only steps). The connection attempt fails
    # ("database \"basirah\" does not exist"), _postgres_reachable()
    # returns False, and all 5 tests in this file skip in that job --
    # confirmed by reading the raw job log for run 34394362022, where
    # all 5 show SKIPPED rather than PASSED. A skip does not fail a CI
    # job, so this went unnoticed until manually inspected.
    #
    # This job exists solely to close that gap: its own Postgres+Redis
    # service containers, a database created specifically for this
    # proof, migrations applied to it, then the file run in isolation
    # with an explicit hard-fail if pytest reports anything other than
    # exactly 5 passed and 0 skipped -- so an unreachable service (or
    # any future regression that makes this skip again) fails the build
    # instead of silently contributing zero evidence.
    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: basirah_refresh_concurrency_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/basirah_refresh_concurrency_ci
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies (clean environment)
        run: pip install -r requirements.txt

      - name: Install package in editable mode
        run: pip install -e . --no-deps

      - name: Apply migrations to the dedicated proof database
        run: python -m alembic upgrade head

      - name: Run refresh-rotation concurrency + family-isolation proof (fails on any skip)
        run: |
          set -euo pipefail
          LOGFILE=$(mktemp)
          python -m pytest tests/integration/test_refresh_rotation_concurrency.py -v -rA 2>&1 | tee "$LOGFILE"

          if grep -q "SKIPPED" "$LOGFILE"; then
            echo ""
            echo "FAIL: at least one test in test_refresh_rotation_concurrency.py was SKIPPED."
            echo "This job exists specifically to prove these tests run for real against"
            echo "reachable Postgres + Redis, not to collect them or rely on the general"
            echo "suite's pass/fail. A skip here means the services this job provisions"
            echo "were not actually reachable from the test process -- fix that, do not"
            echo "relax this check."
            exit 1
          fi

          # pytest's final summary line looks like
          # "============ 5 passed in 12.34s =============" -- padded
          # with "=" on both sides, so match "N passed" anywhere in the
          # line rather than anchoring at line start.
          SUMMARY_LINE=$(grep -E "[0-9]+ (passed|failed|error)" "$LOGFILE" | tail -1 || true)
          PASSED_COUNT=$(echo "$SUMMARY_LINE" | grep -oE "[0-9]+ passed" | grep -oE "[0-9]+" || echo 0)
          echo ""
          echo "Summary line: $SUMMARY_LINE"
          if [ "$PASSED_COUNT" != "5" ]; then
            echo "FAIL: expected exactly 5 passed tests in test_refresh_rotation_concurrency.py, got '$PASSED_COUNT'."
            exit 1
          fi
          echo "All 5 refresh-rotation concurrency + family-isolation tests genuinely PASSED against real Postgres + Redis (0 skipped)."
