name: Verify recent-symbol-outcome disclosure is live (read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Login and check /radar/opportunities for the new fields + deployment_commit
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          cat > /tmp/check.py <<'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.request

          BACKEND = os.environ["BACKEND_URL"]
          STAFF_EMAIL = os.environ["STAFF_EMAIL"]
          STAFF_PASSWORD = os.environ["STAFF_PASSWORD"]

          def post(url, body, cookies=None):
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method="POST", headers={"Content-Type": "application/json"})
              if cookies:
                  req.add_header("Cookie", cookies)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read().decode(), resp.headers
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(), e.headers

          def get(url, cookies):
              req = urllib.request.Request(url, method="GET", headers={"Cookie": cookies})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          status, body, headers = post(f"{BACKEND}/api/v1/auth/login", {"email": STAFF_EMAIL, "password": STAFF_PASSWORD})
          cookie_pairs = [c.split(";")[0] for c in (headers.get_all("Set-Cookie") or [])]
          cookie_header = "; ".join(cookie_pairs)

          print("=== GET /admin/system/summary (deployment_commit) ===")
          status, body = get(f"{BACKEND}/api/v1/admin/system/summary", cookie_header)
          if status == 200:
              print("deployment_commit:", json.loads(body).get("deployment_commit"))
          else:
              print(f"HTTP {status}:", body[:500])

          print()
          print("=== GET /api/v1/radar/opportunities (new recent_negative_outcome_* fields) ===")
          status, body = get(f"{BACKEND}/api/v1/radar/opportunities?limit=200", cookie_header)
          print(f"HTTP {status}")
          if status == 200:
              rows = json.loads(body)
              print("total live opportunities:", len(rows))
              has_field = all("recent_negative_outcome_status" in r for r in rows)
              print("every row has recent_negative_outcome_status key:", has_field)
              flagged = [r for r in rows if r.get("recent_negative_outcome_status") is not None]
              print("rows currently flagged with a recent negative outcome:", len(flagged))
              for r in flagged:
                  print(json.dumps({
                      "symbol": r.get("symbol"),
                      "recent_negative_outcome_status": r.get("recent_negative_outcome_status"),
                      "recent_negative_outcome_label_ar": r.get("recent_negative_outcome_label_ar"),
                      "recent_negative_outcome_at": r.get("recent_negative_outcome_at"),
                      "recent_negative_outcome_return_pct": r.get("recent_negative_outcome_return_pct"),
                  }, ensure_ascii=False))
              row_1830 = next((r for r in rows if r.get("symbol") == "1830"), None)
              if row_1830 is not None:
                  print()
                  print("=== symbol 1830 full relevant fields ===")
                  for k in ["symbol", "classification", "confidence_score", "stop_loss", "price_at_signal",
                            "recent_negative_outcome_status", "recent_negative_outcome_label_ar",
                            "recent_negative_outcome_at", "recent_negative_outcome_return_pct"]:
                      print(f"{k}: {row_1830.get(k)}")
          else:
              print(body[:2000])
          PYEOF
          python3 /tmp/check.py
