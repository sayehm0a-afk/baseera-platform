name: Introspect Railway GraphQL API for a service-update/builder mutation (RAILWAY_TOKEN only)

# Checking exactly what a broader Railway token could unlock before
# asking the user for one -- specifically whether a serviceInstance
# update mutation (to fix the Builder=Railpack-instead-of-Dockerfile
# drift programmatically) exists and whether it's reachable at all
# with the current project-scoped token vs needing an account/team
# token. Read-only: GraphQL introspection only, no mutations executed.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  introspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Fail fast if RAILWAY_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set."
            exit 1
          fi

      - name: List mutation names containing service/builder/instance/deploy
        run: |
          cat > /tmp/introspect.json <<'EOF'
          {"query":"query { __schema { mutationType { fields { name } } } }"}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/introspect.json -o /tmp/introspect_result.json \
            -w "\nHTTP:%{http_code}\n"
          cat > /tmp/parse_mutations.py <<'PYEOF'
          import json
          d = json.load(open('/tmp/introspect_result.json'))
          if 'errors' in d:
              print('ERRORS:', json.dumps(d['errors'], indent=2))
          fields = d.get('data', {}).get('__schema', {}).get('mutationType', {}).get('fields', [])
          names = [f['name'] for f in fields]
          print(f'total mutations visible: {len(names)}')
          matches = [n for n in names if any(k in n.lower() for k in ['service', 'builder', 'instance', 'deploy'])]
          for m in sorted(matches):
              print(m)
          PYEOF
          echo "=== mutation names matching service/builder/instance/deploy ==="
          python3 /tmp/parse_mutations.py

      - name: Check ServiceInstanceUpdateInput shape (introspection only, not executed)
        run: |
          cat > /tmp/introspect2.json <<'EOF'
          {"query":"query { __type(name: \"ServiceInstanceUpdateInput\") { name inputFields { name type { name kind ofType { name kind } } } } }"}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/introspect2.json \
            -w "\nHTTP:%{http_code}\n"
