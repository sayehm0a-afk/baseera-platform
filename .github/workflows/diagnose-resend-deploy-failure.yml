name: Diagnose why the confirmed-Dockerfile backend deploy still fails (RAILWAY_TOKEN only)

# The user confirmed via the Railway dashboard (Settings -> Build) that
# the backend service's Builder is already set to "Dockerfile" with
# Dockerfile Path "Dockerfile" -- yet a fresh `railway up` deploy
# (deployment a6a6edef-ea31-4865-bef6-3b3c544ae7d2, triggered by
# ops-configure-and-verify-resend-email.yml at 2026-09-12T04:14) still
# ended FAILED across the full 30-attempt/7.5-minute poll window, and
# the backend kept serving its old process (booted 2026-09-11 21:13)
# with SmtpEmailSender the whole time -- proving the Railpack-routing
# theory was not (or no longer) the actual failure cause, or a second,
# different failure now exists behind a correctly-configured builder.
#
# `railway logs --build`/`--deployment` were established in an earlier
# diagnostic session to return a generic cached trace, not deployment-
# specific detail. This queries Railway's GraphQL `deploymentLogs`
# query directly for the specific failed deployment ID, which is
# deployment-scoped (not account-scoped) and so should be reachable
# with the existing project-scoped RAILWAY_TOKEN.

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Deployment ID to fetch logs for"
        required: true
        default: "a6a6edef-ea31-4865-bef6-3b3c544ae7d2"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
    steps:
      - name: Fail fast if RAILWAY_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set."
            exit 1
          fi

      - name: Query deployment status/meta for this deployment ID
        run: |
          cat > /tmp/deploy_query.json <<EOF
          {"query":"query(\$id: String!) { deployment(id: \$id) { id status staticUrl createdAt deploymentStopped suggestAddServiceDomain } }","variables":{"id":"$DEPLOYMENT_ID"}}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/deploy_query.json -w "\nHTTP:%{http_code}\n"

      - name: Fetch build logs for this deployment via GraphQL deploymentLogs
        run: |
          cat > /tmp/build_logs_query.json <<EOF
          {"query":"query(\$id: String!) { deploymentLogs(deploymentId: \$id, limit: 500) { message severity timestamp } }","variables":{"id":"$DEPLOYMENT_ID"}}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/build_logs_query.json -o /tmp/build_logs.json \
            -w "\nHTTP:%{http_code}\n"
          echo "=== formatted ==="
          cat > /tmp/format_deployment_logs.py <<'PYEOF'
          import json
          d = json.load(open('/tmp/build_logs.json'))
          if 'errors' in d:
              print('ERRORS:', json.dumps(d['errors'], indent=2))
          logs = (d.get('data') or {}).get('deploymentLogs') or []
          print(f'{len(logs)} log lines')
          for l in logs:
              print(f"[{l.get('severity')}] {l.get('timestamp')} {l.get('message')}")
          PYEOF
          python3 /tmp/format_deployment_logs.py

      - name: Fetch build-specific logs (buildLogs, if distinct from deploymentLogs)
        run: |
          cat > /tmp/build_only_query.json <<EOF
          {"query":"query(\$id: String!) { buildLogs(deploymentId: \$id, limit: 500) { message severity timestamp } }","variables":{"id":"$DEPLOYMENT_ID"}}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/build_only_query.json -o /tmp/build_only.json \
            -w "\nHTTP:%{http_code}\n"
          echo "=== formatted ==="
          cat > /tmp/format_build_logs.py <<'PYEOF'
          import json
          d = json.load(open('/tmp/build_only.json'))
          if 'errors' in d:
              print('ERRORS:', json.dumps(d['errors'], indent=2))
          logs = (d.get('data') or {}).get('buildLogs') or []
          print(f'{len(logs)} log lines')
          for l in logs:
              print(f"[{l.get('severity')}] {l.get('timestamp')} {l.get('message')}")
          PYEOF
          python3 /tmp/format_build_logs.py
