name: Diagnose Production Backend Deploy Failure (temporary, read-only, RAILWAY_TOKEN only)

# Three consecutive real redeploys all ended up FAILED within ~15-20s
# of BUILDING, proven unrelated to any code/variable change (a plain
# no-op redeploy of already-live code failed identically). No browser
# access here to open the Railway dashboard directly. `railway --help`
# revealed a native `usage` subcommand ("Show workspace usage and
# manage usage limits") -- checking that directly, since a usage/plan
# limit is the most likely explanation for every build instantly
# failing regardless of what's being deployed.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Fail fast if RAILWAY_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: railway usage --help
        run: railway usage --help 2>&1 || true

      - name: railway usage
        run: railway usage 2>&1 || true

      - name: railway usage --json (if supported)
        run: railway usage --json 2>&1 || true
