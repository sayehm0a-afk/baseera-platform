name: Force Dockerfile mode on backend via Railway GraphQL (account token, one-off)

# The project-scoped RAILWAY_TOKEN secret genuinely lacks permission
# to read/write serviceInstance (confirmed: "Not Authorized" on both
# the query and the serviceInstanceUpdate mutation). This uses a
# broader Account Token, passed as a one-off dispatch input (not
# stored as a secret -- no channel available in this session to
# create an encrypted repo secret), to perform the same fix and
# nothing else. DOCKERFILE is not a valid Builder enum value (only
# HEROKU/NIXPACKS/PAKETO/RAILPACK are) -- Dockerfile mode is signaled
# by builder=null with dockerfilePath set.
#
# workflow_dispatch inputs are NOT masked in this run's own logs
# (GitHub Actions limitation, already disclosed in this session's
# other ops workflows) -- the user should revoke this token from
# Railway's Account Settings -> Tokens once this is done.

on:
  workflow_dispatch:
    inputs:
      railway_account_token:
        description: "Railway Account Token (one-off use, revoke after)"
        required: true

permissions:
  contents: read

jobs:
  fix-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ github.event.inputs.railway_account_token }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve project/environment/service IDs (using the project-scoped token's own linked context)
        id: ids
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway status --json > /tmp/status.json
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/status.json'))['id'])")
          ENV_ID=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); [print(e['node']['id']) for e in d['environments']['edges'] if e['node']['name']=='production']")
          SERVICE_ID=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); [print(s['node']['id']) for s in d['services']['edges'] if s['node']['name']=='backend']")
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"
          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_ID / Env: $ENV_ID / Service: $SERVICE_ID"

      - name: Read the CURRENT serviceInstance config (with the account token)
        env:
          SERVICE_ID: ${{ steps.ids.outputs.service_id }}
          ENV_ID: ${{ steps.ids.outputs.env_id }}
        run: |
          cat > /tmp/current_query.json <<EOF
          {"query":"query(\$serviceId: String!, \$environmentId: String!) { serviceInstance(serviceId: \$serviceId, environmentId: \$environmentId) { builder dockerfilePath rootDirectory } }","variables":{"serviceId":"$SERVICE_ID","environmentId":"$ENV_ID"}}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/current_query.json -w "\nHTTP:%{http_code}\n"

      - name: Both attempts (null and omitted) left builder=RAILPACK unchanged -- inspect serviceUpdate mutation instead
        run: |
          cat > /tmp/su_input.json <<'EOF'
          {"query":"query { __type(name: \"ServiceUpdateInput\") { name inputFields { name type { name kind ofType { name kind } } } } }"}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/su_input.json -w "\nHTTP:%{http_code}\n"

      - name: Re-read serviceInstance config to confirm the change stuck
        env:
          SERVICE_ID: ${{ steps.ids.outputs.service_id }}
          ENV_ID: ${{ steps.ids.outputs.env_id }}
        run: |
          cat > /tmp/verify_query.json <<EOF
          {"query":"query(\$serviceId: String!, \$environmentId: String!) { serviceInstance(serviceId: \$serviceId, environmentId: \$environmentId) { builder dockerfilePath rootDirectory } }","variables":{"serviceId":"$SERVICE_ID","environmentId":"$ENV_ID"}}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/verify_query.json -w "\nHTTP:%{http_code}\n"
