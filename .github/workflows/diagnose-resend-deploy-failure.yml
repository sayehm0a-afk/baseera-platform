name: Diagnose Production Backend Deploy Failure (temporary, read-only-ish, RAILWAY_TOKEN only)

# Two consecutive real redeploys triggered specifically to activate
# ResendEmailSender (RESEND_API_KEY/RESEND_FROM_EMAIL) both ended up
# `status: FAILED, deploymentStopped: true` -- deployments
# 12f01fa5-bf05-4888-a9c0-f5edc7f0b0b6 and
# 883d3de3-a4e4-4532-8223-12851511747f, both 100% of the ~7.5-minute
# poll window, both while the backend service kept serving its old,
# unrelated 16:16 process the whole time (confirmed via
# ops-configure-and-verify-resend-email.yml's own log-check step
# showing the exact same startup timestamp before and after both
# attempts). `railway logs --deployment <id>`/`--build` do not surface
# a deployment-specific runtime crash trace for either -- `--build`
# appears to just return the latest cached generic builder trace
# regardless of which deployment ID is passed (proven by byte-
# identical output across two different failed deployment IDs).
#
# This isolating step triggers a THIRD redeploy of the exact same
# already-live code (no variable changes at all) to determine whether
# deploys are broken at the platform level right now in general, or
# specifically correlated with the Resend variables/code path.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Fail fast if RAILWAY_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy backend with NO variable changes (isolating test)
        id: deploy
        run: |
          railway up --service backend --detach 2>&1 | tee /tmp/deploy_output.txt
          sleep 5
          railway service list --json > /tmp/services_after_deploy.json
          NEW_DEPLOYMENT=$(jq -r 'if type=="array" then . else .services end | .[] | select(.name=="backend") | .latestDeployment.id // empty' /tmp/services_after_deploy.json)
          echo "new_deployment=$NEW_DEPLOYMENT" >> "$GITHUB_OUTPUT"
          echo "Triggered deployment: $NEW_DEPLOYMENT"

      - name: Poll for up to 5 minutes and print every status transition
        env:
          EXPECTED_BACKEND_DEPLOYMENT: ${{ steps.deploy.outputs.new_deployment }}
        run: |
          LAST_STATUS=""
          for i in $(seq 1 20); do
            railway service list --json > /tmp/services.json 2>/tmp/services_err.txt || true
            CURRENT=$(jq -r 'if type=="array" then . else .services end | .[] | select(.name=="backend") | .latestDeployment.id // empty' /tmp/services.json 2>/dev/null || echo "")
            STATUS=$(jq -r 'if type=="array" then . else .services end | .[] | select(.name=="backend") | .latestDeployment.status // empty' /tmp/services.json 2>/dev/null || echo "")
            if [ "$STATUS" != "$LAST_STATUS" ]; then
              echo "attempt $i: backend latestDeployment.id=$CURRENT status=$STATUS (transition)"
              LAST_STATUS="$STATUS"
            fi
            if [ "$CURRENT" = "$EXPECTED_BACKEND_DEPLOYMENT" ] && [ "$STATUS" = "SUCCESS" ]; then
              echo "RESULT: SUCCESS -- a plain redeploy with no variable changes works fine."
              exit 0
            fi
            sleep 15
          done
          echo "RESULT: TIMED OUT WITHOUT SUCCESS -- final status=$STATUS. Deploys are broken at the platform level right now, unrelated to any specific env var."
          exit 1
