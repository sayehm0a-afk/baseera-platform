name: Force-set backend Builder=DOCKERFILE via Railway GraphQL API (RAILWAY_TOKEN only)

# Introspection (previous run) found the CURRENT project-scoped
# RAILWAY_TOKEN already has enough access to call the GraphQL API
# directly -- no broader/account-level token needed. serviceInstance
# Update takes builder/dockerfilePath fields directly. Every fresh
# `railway up` build has been silently routed through Railpack
# despite railway.toml and the dashboard's own shown config both
# saying DOCKERFILE -- this forces it explicitly via the same
# mutation the dashboard itself would use, in case the CLI's `up`
# command isn't actually sending builder config the same way.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Fail fast if RAILWAY_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve project/environment/service IDs
        id: ids
        run: |
          railway status --json > /tmp/status.json
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/status.json'))['id'])")
          ENV_ID=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); [print(e['node']['id']) for e in d['environments']['edges'] if e['node']['name']=='production']")
          SERVICE_ID=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); [print(s['node']['id']) for s in d['services']['edges'] if s['node']['name']=='backend']")
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"
          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_ID / Env: $ENV_ID / Service: $SERVICE_ID"

      - name: Check the Builder enum's valid values
        run: |
          cat > /tmp/enum_query.json <<'EOF'
          {"query":"query { __type(name: \"Builder\") { enumValues { name } } }"}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/enum_query.json -w "\nHTTP:%{http_code}\n"

      - name: Read the CURRENT serviceInstance config before touching anything
        env:
          SERVICE_ID: ${{ steps.ids.outputs.service_id }}
          ENV_ID: ${{ steps.ids.outputs.env_id }}
        run: |
          cat > /tmp/current_query.json <<EOF
          {"query":"query(\$serviceId: String!, \$environmentId: String!) { serviceInstance(serviceId: \$serviceId, environmentId: \$environmentId) { builder dockerfilePath rootDirectory } }","variables":{"serviceId":"$SERVICE_ID","environmentId":"$ENV_ID"}}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/current_query.json -w "\nHTTP:%{http_code}\n"

      - name: Force builder=DOCKERFILE via serviceInstanceUpdate mutation
        env:
          SERVICE_ID: ${{ steps.ids.outputs.service_id }}
          ENV_ID: ${{ steps.ids.outputs.env_id }}
        run: |
          cat > /tmp/mutation.json <<EOF
          {"query":"mutation(\$serviceId: String!, \$environmentId: String!, \$input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: \$serviceId, environmentId: \$environmentId, input: \$input) }","variables":{"serviceId":"$SERVICE_ID","environmentId":"$ENV_ID","input":{"builder":"DOCKERFILE","dockerfilePath":"Dockerfile"}}}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/mutation.json -w "\nHTTP:%{http_code}\n"

      - name: Re-read serviceInstance config to confirm the change stuck
        env:
          SERVICE_ID: ${{ steps.ids.outputs.service_id }}
          ENV_ID: ${{ steps.ids.outputs.env_id }}
        run: |
          cat > /tmp/verify_query.json <<EOF
          {"query":"query(\$serviceId: String!, \$environmentId: String!) { serviceInstance(serviceId: \$serviceId, environmentId: \$environmentId) { builder dockerfilePath rootDirectory } }","variables":{"serviceId":"$SERVICE_ID","environmentId":"$ENV_ID"}}
          EOF
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/verify_query.json -w "\nHTTP:%{http_code}\n"
