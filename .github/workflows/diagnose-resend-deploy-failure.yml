name: Restart backend without rebuilding to pick up RESEND_* vars (RAILWAY_TOKEN only)

# Every `railway up` (fresh build) attempt has failed at the build
# step -- confirmed via the dashboard: the failing builds used
# Railpack ("prepare railpack-v0.39.0", detected only Staticfile/Shell
# providers) even though railway.toml and the service's own shown
# config both say builder=DOCKERFILE, and the last genuinely
# successful deployment (still the one actively serving traffic) also
# used Dockerfile. Something is intermittently routing fresh builds
# through Railpack instead of the Dockerfile.
#
# Workaround: RESEND_API_KEY/RESEND_FROM_EMAIL are already set on the
# service (env vars are injected at container start, not baked into
# the image) -- `railway restart` restarts the service's latest
# already-successful image WITHOUT triggering a new build at all, so
# it should completely sidestep the broken build path and pick up the
# new variables immediately.

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Real address to send a test forgot-password email to"
        required: true
        default: "sayehm0a@gmail.com"

permissions:
  contents: read

jobs:
  restart-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TEST_EMAIL: ${{ github.event.inputs.test_email }}
    steps:
      - name: Fail fast if RAILWAY_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: railway restart --help (confirm exact syntax before using it on production)
        run: railway restart --help 2>&1 || true

      - name: railway restart --service backend (no rebuild)
        run: railway restart --service backend 2>&1 || true

      - name: Wait for the restarted process to finish booting
        run: sleep 30

      - name: Trigger one real forgot-password request
        run: |
          STATUS=$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/resp.json -w "%{http_code}" \
            -X POST "${{ steps.urls.outputs.backend_url }}/api/v1/auth/forgot-password" \
            -H "Content-Type: application/json" \
            -d "{\"email\": \"$TEST_EMAIL\"}")
          echo "HTTP $STATUS"
          cat /tmp/resp.json

      - name: Check the backend's own logs for the real send outcome
        run: |
          sleep 8
          railway logs --service backend 2>&1 > /tmp/full_logs.txt || true
          echo "=== lines mentioning EmailSender/Resend for this test ==="
          grep -i "EmailSender\|resend" /tmp/full_logs.txt || echo "(no matching lines -- see full tail below)"
          echo "=== full tail (last 60 lines) ==="
          tail -60 /tmp/full_logs.txt
