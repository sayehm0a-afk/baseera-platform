name: Production Coverage Detail (read-only diagnostics)

# Diagnostic-only, kept as a durable on-demand tool (not a one-shot):
# fetches GET /coverage and GET /admin/system/summary from the live
# production backend and prints real evidence -- per-ingestion-job
# error_summary, exact symbols missing price history / skipped by the
# latest scan, db_consistency, and (critically) the actual deployed
# commit + Live Market Mode scheduler state, since `railway up
# --detach` returns before the new build is actually serving traffic
# and the deploy workflow's own health check can pass against the
# still-running previous deployment. Never triggers a new discovery/
# ingestion/scan pass -- read-only.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  fetch_detail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Fail fast if required secrets are not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$STAFF_EMAIL" ] || [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::RAILWAY_TOKEN/STAFF_EMAIL/STAFF_PASSWORD not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Log in as the staff account
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/staff_cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Staff login failed."
            exit 1
          fi

      - name: Fetch admin system summary (real deployed commit + Live Market Mode state)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 30 -b /tmp/staff_cookies.txt \
            "$BACKEND_URL/api/v1/admin/system/summary" -o /tmp/summary.json
          python3 -c "
          import json
          d = json.load(open('/tmp/summary.json'))
          print('deployment_commit:', d.get('deployment_commit'))
          print('database_health:', d.get('database_health'), '| redis_health:', d.get('redis_health'))
          print('ingestion_scheduler_running:', d.get('ingestion_scheduler_running'))
          print('market_intelligence_scheduler_running:', d.get('market_intelligence_scheduler_running'))
          print('live_market_mode_enabled:', d.get('live_market_mode_enabled'))
          print('live_market_mode_running:', d.get('live_market_mode_running'))
          print('live_market_mode_market_currently_open:', d.get('live_market_mode_market_currently_open'))
          print('market_status:', d.get('market_status'), '|', d.get('market_status_label_ar'))
          print('market_data_provider:', d.get('market_data_provider'), '| market_data_health:', d.get('market_data_health'))
          print()
          print('=== sahmk_quota_status ===')
          print(json.dumps(d.get('sahmk_quota_status'), indent=2, ensure_ascii=False))
          "

      - name: Fetch coverage and print full ingestion job detail (including error_summary)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 30 -b /tmp/staff_cookies.txt \
            "$BACKEND_URL/api/v1/admin/market-intelligence/coverage" -o /tmp/coverage.json
          python3 -c "
          import json
          d = json.load(open('/tmp/coverage.json'))
          print('total_stocks=%s active_stocks=%s main_market=%s nomu_market=%s with_price_history=%s' % (
              d.get('total_stocks'), d.get('active_stocks'), d.get('main_market_stocks'), d.get('nomu_market_stocks'), d.get('stocks_with_price_history')))
          print()
          for r in d.get('latest_ingestion_runs') or []:
              print('=== job:', r.get('job_name'), '===')
              print('  status:', r.get('status'))
              print('  succeeded:', r.get('symbols_succeeded'), '| failed:', r.get('symbols_failed'))
              print('  started_at:', r.get('started_at'), '| finished_at:', r.get('finished_at'))
              print('  error_summary:', r.get('error_summary'))
              print()
          print('unclassified_market_segment_stocks:', d.get('unclassified_market_segment_stocks'))
          print()
          print('=== instrument_bucket_counts (Stock.instrument_bucket -> count) ===')
          for row in d.get('instrument_bucket_counts') or []:
              print(' ', row.get('bucket'), '->', row.get('count'))
          print()
          print('=== excluded_instrument_counts ===')
          for row in d.get('excluded_instrument_counts') or []:
              print(' ', row.get('bucket'), '->', row.get('count'))
          print('total_excluded_non_equity:', d.get('total_excluded_non_equity'))
          print()
          print('=== fundamentals/dividends coverage ===')
          print('stocks_with_fundamentals:', d.get('stocks_with_fundamentals'), '| stocks_without_fundamentals:', d.get('stocks_without_fundamentals'))
          print('stocks_with_dividends:', d.get('stocks_with_dividends'), '| stocks_without_dividends:', d.get('stocks_without_dividends'))
          print()
          print('=== db_consistency (0 everywhere == no classification corruption) ===')
          print(json.dumps(d.get('db_consistency'), indent=2, ensure_ascii=False))
          print()
          print('=== pipeline_funnel (discovery -> analysis-ready) ===')
          for stage in d.get('pipeline_funnel') or []:
              print(' ', json.dumps(stage, ensure_ascii=False))
          print()
          print('=== latest_scan_run ===')
          print(json.dumps(d.get('latest_scan_run'), indent=2, ensure_ascii=False))
          print('latest_scan_symbols_entering_decision_engine:', d.get('latest_scan_symbols_entering_decision_engine'))
          print('latest_scan_recommendations_generated:', d.get('latest_scan_recommendations_generated'))
          print()
          print('=== sector_coverage ===')
          for row in d.get('sector_coverage') or []:
              print(' ', json.dumps(row, ensure_ascii=False))
          print()
          print('=== symbols_missing_price_history (exact symbols, capped at 50) ===')
          print(d.get('symbols_missing_price_history'))
          print()
          print('=== latest_scan_skipped_symbols (exact symbols) ===')
          print(d.get('latest_scan_skipped_symbols'))
          "

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-detail-evidence
          path: |
            /tmp/coverage.json
            /tmp/summary.json
          retention-days: 14

      - name: Clean up local session artifacts
        if: always()
        run: rm -f /tmp/staff_cookies.txt /tmp/login_body.json
