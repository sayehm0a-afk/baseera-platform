name: Production Frontend Verification (Playwright, read-only)

# Real browser verification of the deployed frontend against the real
# deployed backend, per mandate section 7 ("frontend verification is
# now mandatory"). This session's own sandbox has Chromium/Playwright
# installed but its network egress to *.up.railway.app is blocked by
# policy (confirmed via the agent-proxy status endpoint returning a 403
# CONNECT rejection) -- GitHub Actions runners have normal internet
# access, so this workflow does what the sandbox structurally cannot:
# launch headless Chromium, log in as a real user, navigate the real
# production screens, and capture screenshots + text-content assertions
# as durable evidence, never a mock.
#
# Read-only: logs in and browses only. Never submits a watchlist
# add/remove, registration, or any other mutating form -- this is
# observation, not an end-to-end mutation test.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend
  RAILWAY_FRONTEND_SERVICE: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Fail fast if required secrets are not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$STAFF_EMAIL" ] || [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::RAILWAY_TOKEN/STAFF_EMAIL/STAFF_PASSWORD not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend + frontend public URLs
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

          railway domain list --service "$RAILWAY_FRONTEND_SERVICE" --json > /tmp/frontend_domains.json
          FRONTEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/frontend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend:  $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"

      - name: Install Playwright (Chromium only)
        run: |
          npm init -y --silent > /dev/null
          npm install --no-save playwright@1.48.0 --silent
          npx playwright install --with-deps chromium

      - name: Drive the real frontend with headless Chromium
        id: verify
        env:
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: |
          mkdir -p /tmp/screenshots
          node <<'NODESCRIPT'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const FRONTEND_URL = process.env.FRONTEND_URL;
          const STAFF_EMAIL = process.env.STAFF_EMAIL;
          const STAFF_PASSWORD = process.env.STAFF_PASSWORD;

          const results = [];

          function record(name, ok, detail) {
            results.push({ name, ok, detail });
            console.log(`[${ok ? 'PASS' : 'FAIL'}] ${name}: ${detail}`);
          }

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            page.setDefaultTimeout(20000);

            try {
              await page.goto(FRONTEND_URL, { waitUntil: 'domcontentloaded' });
              await page.screenshot({ path: '/tmp/screenshots/01_landing.png', fullPage: true });
              record('landing_page_loads', true, `Loaded ${FRONTEND_URL}, title="${await page.title()}"`);
            } catch (e) {
              record('landing_page_loads', false, String(e));
            }

            // Try to find and use a login form -- selector-agnostic: look
            // for an email input anywhere on the page (RTL Arabic UI may
            // not have stable English test-ids).
            //
            // Diagnostic capture (added after run 31276687473 showed a
            // real login failure in-browser despite curl-based staff
            // logins succeeding all session): every network
            // request/response touching /api/v1/auth/* is logged, plus
            // any console error, plus the exact error text (if any)
            // rendered on the page after submit -- so a real failure
            // reason is captured instead of just "still on /login".
            const authNetworkLog = [];
            page.on('request', (req) => {
              if (req.url().includes('/api/v1/auth/')) {
                authNetworkLog.push({ type: 'request', method: req.method(), url: req.url(), headers: req.headers() });
              }
            });
            page.on('response', async (res) => {
              if (res.url().includes('/api/v1/auth/')) {
                let bodySnippet = '';
                try { bodySnippet = (await res.text()).slice(0, 500); } catch (e) { bodySnippet = `<unreadable: ${e}>`; }
                authNetworkLog.push({
                  type: 'response',
                  status: res.status(),
                  url: res.url(),
                  headers: res.headers(),
                  body: bodySnippet,
                });
              }
            });
            const consoleErrors = [];
            page.on('console', (msg) => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', (err) => consoleErrors.push(String(err)));

            try {
              const emailInput = page.locator('input[type="email"], input[name="email"]').first();
              await emailInput.waitFor({ timeout: 10000 });
              await emailInput.fill(STAFF_EMAIL);
              const passwordInput = page.locator('input[type="password"]').first();
              await passwordInput.fill(STAFF_PASSWORD);
              await page.screenshot({ path: '/tmp/screenshots/02_login_filled.png', fullPage: true });

              const submitButton = page.locator('button[type="submit"]').first();
              await submitButton.click();
              await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
              await page.screenshot({ path: '/tmp/screenshots/03_after_login.png', fullPage: true });

              const bodyText = await page.textContent('body');
              const stillOnLoginForm = await page.locator('input[type="password"]').count() > 0
                && (await page.url()).includes('login');
              // Capture whatever Arabic/error text the login page itself
              // is showing (ERROR_MESSAGES map in login/page.tsx renders
              // into a visible element) -- this is the real, in-app
              // explanation for the failure, not an inference.
              let visibleErrorText = null;
              try {
                const errorLocator = page.locator('[role="alert"], .error, [data-testid="login-error"]').first();
                if (await errorLocator.count() > 0) {
                  visibleErrorText = await errorLocator.textContent();
                }
              } catch (e) { /* no error element found -- fine */ }
              record(
                'login_flow_reaches_authenticated_area',
                !stillOnLoginForm,
                `Post-login URL: ${page.url()} | visible_error_text: ${JSON.stringify(visibleErrorText)}`
              );
              fs.writeFileSync('/tmp/screenshots/auth_network_log.json', JSON.stringify(authNetworkLog, null, 2));
              fs.writeFileSync('/tmp/screenshots/console_errors.json', JSON.stringify(consoleErrors, null, 2));
            } catch (e) {
              record('login_flow_reaches_authenticated_area', false, String(e));
              fs.writeFileSync('/tmp/screenshots/auth_network_log.json', JSON.stringify(authNetworkLog, null, 2));
              fs.writeFileSync('/tmp/screenshots/console_errors.json', JSON.stringify(consoleErrors, null, 2));
            }

            // Real market-coverage evidence check: the page body must not
            // be showing only a tiny fixed handful of symbols/placeholder
            // text -- count distinct 4-digit Tadawul-style symbol tokens
            // visible anywhere on the current page as a rough breadth
            // signal (not a strict assertion, since layout varies).
            try {
              const bodyText = await page.textContent('body');
              const symbolMatches = new Set((bodyText.match(/\b\d{4}\b/g) || []));
              record(
                'page_shows_more_than_a_handful_of_distinct_symbols',
                symbolMatches.size > 0,
                `Distinct 4-digit tokens visible on current page: ${symbolMatches.size}`
              );
              const hasArabicText = /[؀-ۿ]/.test(bodyText);
              record('arabic_text_present', hasArabicText, `Arabic Unicode range detected: ${hasArabicText}`);
              const hasRawEngineeringTerms = /DecisionV2Snapshot|SymbolIntelligenceRecord|INSUFFICIENT_DATA|Traceback|NoneType/.test(bodyText);
              record('no_raw_engineering_terms_visible', !hasRawEngineeringTerms, `Raw internal terms found: ${hasRawEngineeringTerms}`);
            } catch (e) {
              record('page_content_checks', false, String(e));
            }

            await page.screenshot({ path: '/tmp/screenshots/04_final_state.png', fullPage: true });
            await browser.close();

            fs.writeFileSync('/tmp/screenshots/results.json', JSON.stringify(results, null, 2));
            const failed = results.filter(r => !r.ok);
            console.log(`\n=== ${results.length - failed.length}/${results.length} checks passed ===`);
            if (failed.length > 0) {
              console.log('Failed checks:', failed.map(f => f.name).join(', '));
            }
          })();
          NODESCRIPT

      - name: Upload screenshots + results as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-evidence
          path: /tmp/screenshots/
          retention-days: 14
