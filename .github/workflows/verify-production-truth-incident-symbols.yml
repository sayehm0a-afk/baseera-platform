name: Verify Production Truth -- Incident Symbols (temporary, one-shot, read-only, zero SAHMK cost)

# BASIRAH -- URGENT PRODUCTION TRUTH & DECISION CONSISTENCY AUDIT.
# Gathers live, already-persisted evidence for the 5 reported incident
# symbols (2286, 6060, 2030, 4050, 1301) across Radar, the legacy V1
# Recommendation-engine watchlist categories, and the personal watchlist,
# plus overall decision-distribution/gate-fail/validation-report/SAHMK-
# consumption telemetry. Never calls GET /decision-v2/{symbol} (that
# recomputes live and inserts a new DecisionV2Snapshot row, costing SAHMK
# quota) and never triggers a scan -- every request here is a plain GET
# against an existing, already-computed, persisted-state route, same as
# a real subscriber/staff page load.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if required secrets are not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$STAFF_EMAIL" ] || [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::RAILWAY_TOKEN/STAFF_EMAIL/STAFF_PASSWORD not set."
            exit 1
          fi

      - run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Gather production-truth evidence for incident symbols
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: python3 .github/workflows/independent_audit/verify_production_truth_incident_symbols.py

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-truth-incident-symbols-evidence
          path: /tmp/production_truth_evidence.json
          retention-days: 14
