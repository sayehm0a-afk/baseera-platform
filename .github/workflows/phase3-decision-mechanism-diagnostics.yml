name: Phase 3 Decision Mechanism Diagnostics - Read-only mechanism-level instrumentation (temporary, zero SAHMK cost)

# BASIRAH -- PHASE 3 DECISION-ENGINE TARGETED IMPROVEMENTS, diagnostic-
# only follow-up to phase3-historical-validation-backtest.yml: reuses
# that workflow's exact real-OHLCV-pull + staff-login + DecisionEngineV2
# historical-replay harness (Baseline V2 vs Phase 3 V2, same clock-
# injection fix already on this branch) and additionally instruments
# every evaluated point's anti-chase entry_status, breakout
# confirmation, HIGH_QUALITY_BUY, sector-relative-strength, and
# confidence-calibration reachability -- never deploys or merges
# trading logic, never mutates any decision/gate/threshold file. A
# one-shot, offline, read-only analysis job.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet -r requirements.txt

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Pull real OHLCV + run instrumented mechanism diagnostics
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: python3 .github/workflows/independent_audit/phase3_decision_mechanism_diagnostics.py

      - name: Upload full diagnostics report artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-decision-mechanism-diagnostics-report
          path: phase3_decision_mechanism_diagnostics_report.json
          retention-days: 14
