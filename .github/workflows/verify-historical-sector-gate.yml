name: Verify historical-sector-failure gate is live (read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Login and check /decision-v2 for a real Energy-sector symbol
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          cat > /tmp/check.py <<'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.request

          BACKEND = os.environ["BACKEND_URL"]
          STAFF_EMAIL = os.environ["STAFF_EMAIL"]
          STAFF_PASSWORD = os.environ["STAFF_PASSWORD"]

          def post(url, body, cookies=None):
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method="POST", headers={"Content-Type": "application/json"})
              if cookies:
                  req.add_header("Cookie", cookies)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read().decode(), resp.headers
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(), e.headers

          def get(url, cookies):
              req = urllib.request.Request(url, method="GET", headers={"Cookie": cookies})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          status, body, headers = post(f"{BACKEND}/api/v1/auth/login", {"email": STAFF_EMAIL, "password": STAFF_PASSWORD})
          cookie_pairs = [c.split(";")[0] for c in (headers.get_all("Set-Cookie") or [])]
          cookie_header = "; ".join(cookie_pairs)

          print("=== GET /admin/system/summary (deployment_commit) ===")
          status, body = get(f"{BACKEND}/api/v1/admin/system/summary", cookie_header)
          if status == 200:
              print("deployment_commit:", json.loads(body).get("deployment_commit"))
          print()

          for symbol in ["2222", "1830"]:
              print(f"=== GET /api/v1/stocks/{symbol}/decision-v2 ===")
              status, body = get(f"{BACKEND}/api/v1/stocks/{symbol}/decision-v2", cookie_header)
              print(f"HTTP {status}")
              if status == 200:
                  d = json.loads(body)
                  print("symbol:", d.get("symbol"), "sector_ar:", d.get("sector_ar"), "decision:", d.get("decision"))
                  gate = next((g for g in d.get("gates", []) if g.get("name") == "historical_sector_reliability"), None)
                  if gate is None:
                      print("historical_sector_reliability gate: NOT PRESENT (decision returned before reaching it)")
                  else:
                      print("historical_sector_reliability gate:", json.dumps(gate, ensure_ascii=False))
              else:
                  print(body[:1000])
              print()
          PYEOF
          python3 /tmp/check.py
