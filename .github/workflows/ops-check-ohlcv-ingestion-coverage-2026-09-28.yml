name: Ops - Check real OHLCV ingestion job status and coverage (zero-SAHMK-cost, read-only, 2026-09-28)

# Real finding today: GET /stocks/7010/decision-v2 shows a live,
# confirmed SAHMK quote (12 minutes old, live_quote_confirmed PASS)
# but ohlcv_staleness FAILS because the latest daily candle is 39.4
# days old -- blocking any real BUY classification regardless of live
# price. This dispatches only /admin/market-intelligence/coverage,
# which is a direct SQL read (last run of each of the 4 ingestion
# jobs -- symbols/historical_ohlcv/fundamentals/dividends -- plus
# how many active stocks actually have any price history at all) and
# never calls the live SAHMK provider, to find out whether this is a
# global historical_ohlcv ingestion outage or isolated to one symbol.
# Never modifies anything.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Log in as staff
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then echo "::error::login failed"; exit 1; fi

      - name: Real admin/market-intelligence/coverage (zero SAHMK network cost -- direct SQL read)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt \
            "$BACKEND_URL/api/v1/admin/market-intelligence/coverage" -o /tmp/coverage.json -w "\nHTTP %{http_code}\n"
          python3 -c "
          import json
          d = json.load(open('/tmp/coverage.json'))
          print(json.dumps(d, indent=2, ensure_ascii=False))
          "

      - name: Security check -- grep captured responses for secret-leak patterns
        if: always()
        run: |
          PATTERN='sk-[A-Za-z0-9]{10,}|RAILWAY_TOKEN|SAHMK_API_KEY|postgres:\/\/[^"]*:[^"]*@|SECRET_KEY|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          FOUND=0
          for f in /tmp/*.json; do
            [ -f "$f" ] || continue
            if grep -qE "$PATTERN" "$f"; then
              echo "::error::Potential secret-leak pattern found in $f"
              FOUND=1
            fi
          done
          if [ "$FOUND" != "0" ]; then exit 1; fi
          echo "No secret-leak patterns found."
