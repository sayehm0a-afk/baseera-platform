name: Phase 3 Historical Validation - Real OHLCV Export (temporary, read-only, zero SAHMK cost)

# BASIRAH -- PHASE 3 REAL HISTORICAL VALIDATION DATA ACCESS mandate:
# pulls the real, already-ingested OHLCV history out of production
# through the new staff-only GET /api/v1/admin/historical-data-export/
# ohlcv route (deployed in isolation on the
# historical-data-export-diagnostic branch -- no Phase 3 trading-logic
# changes are part of that deployment) so the DecisionEngineV2
# historical validation harness can run against real data locally.
# Makes zero SAHMK API calls (see phase3_historical_validation_export.py's
# own docstring). Never merges or deploys Phase 3 trading logic.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
      EXPECTED_COMMIT: "9292d666d31a19e38838fe0ea855403507fe824"
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Pull real historical OHLCV + compute Phase A data-quality report
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: python3 .github/workflows/independent_audit/phase3_historical_validation_export.py

      - name: Upload export artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase3-historical-ohlcv-export
          path: |
            historical_ohlcv_export.json
            phase_a_report.json
          retention-days: 7
