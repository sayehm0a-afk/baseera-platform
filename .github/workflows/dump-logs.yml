name: Dump Backend Logs (temporary, one-shot, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: python3 .github/workflows/independent_audit/dump_logs.py
