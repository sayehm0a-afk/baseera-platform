name: Phase 3 Zero-Signal Root-Cause Diagnostic (temporary, read-only, zero SAHMK cost)

# Read-only diagnostic: decision-generation-only pass over the same
# grid as run 32581662713 (no outcome/target-stop tracking -- lighter
# than the full backtest). Never modifies DecisionEngineV2, never
# changes thresholds, never merges or deploys anything.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet -r requirements.txt

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Decision-only root-cause diagnostic
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: python3 .github/workflows/independent_audit/phase3_zero_signal_root_cause.py

      - name: Upload full report artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-zero-signal-root-cause
          path: phase3_zero_signal_root_cause.json
          retention-days: 14
