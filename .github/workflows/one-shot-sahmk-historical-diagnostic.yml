name: One-Shot SAHMK Historical Diagnostic (real, hard-capped at 1 request)

# Forensic, one-shot tooling: runs scripts/one_shot_sahmk_historical_diagnostic.py
# with the real backend service's own environment (SAHMK_API_KEY,
# DATABASE_URL, REDIS_URL) via `railway run`, so the diagnostic uses
# the exact same production credentials/DB as the real backend without
# deploying any new code. The script itself hard-guarantees at most one
# real wire request to SAHMK regardless of the response received (see
# its own module docstring) -- this workflow performs zero additional
# SAHMK-consuming steps of its own; the sanity-check step below only
# checks for the *presence* of the expected env vars, never their
# values, and makes no network call to SAHMK.
#
# Read-only from the DB side except for the one real Historical GET
# itself, which never writes anything (the diagnostic script does not
# call upsert_price_bar or persist any ingestion result).

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol to diagnose (must match the script's own safety expectations)"
        required: false
        default: "1213"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DIAGNOSTIC_SYMBOL: ${{ inputs.symbol }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Fail fast if RAILWAY_TOKEN is not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not readable by this job."
            exit 1
          fi

      - name: Sanity check -- confirm railway run injects the backend's real env (presence only, zero SAHMK cost)
        run: |
          railway run --service backend -- python3 -c "
          import os
          print('SAHMK_API_KEY present:', bool(os.environ.get('SAHMK_API_KEY')))
          print('DATABASE_URL present:', bool(os.environ.get('DATABASE_URL')))
          print('REDIS_URL present:', bool(os.environ.get('REDIS_URL')))
          "

      - name: Run the exactly-one-request diagnostic (real, hard-capped)
        run: railway run --service backend -- python3 scripts/one_shot_sahmk_historical_diagnostic.py
