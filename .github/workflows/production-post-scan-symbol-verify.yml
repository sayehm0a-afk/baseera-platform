name: Production Post-Scan Symbol Verification (temporary, one-shot)

# After the 2026-08-08 full-universe scan (MarketScanRun id 98, 391
# symbols) grew analysis-ready coverage from 5 to 391 symbols, this
# verifies real Decision Engine V2 output for symbols outside the old
# ~96-stock universe: 9606 (Tharwah, real Nomu/Parallel Market company,
# independently verified via news citations -- see
# _DEFAULT_SYMBOL_LOOKUP_TEST_SYMBOLS in market_intelligence.py) plus
# whichever Main Market symbols /market/rankings now surfaces beyond
# the old {1120,7010,2010,2222} sample. Also spot-checks the personal
# watchlist CRUD path (add/list/remove) on the same staff session, and
# confirms Stock.symbol has zero duplicates via a real SQL-backed
# admin route rather than an inferred guarantee.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Fail fast if required secrets are not configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$STAFF_EMAIL" ] || [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::RAILWAY_TOKEN/STAFF_EMAIL/STAFF_PASSWORD not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Log in as the staff account
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/staff_cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Staff login failed."
            exit 1
          fi
          CSRF=$(grep -i csrf_token /tmp/staff_cookies.txt | awk '{print $NF}')
          echo "$CSRF" > /tmp/.staff_csrf

      - name: Real Nomu symbol (9606) via decision-v2
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 60 -b /tmp/staff_cookies.txt \
            "$BACKEND_URL/api/v1/stocks/9606/decision-v2" -o /tmp/decision_9606.json -w "\nHTTP %{http_code}\n"
          python3 -c "
          import json
          d = json.load(open('/tmp/decision_9606.json'))
          print('symbol:', d.get('symbol'), '| company_name_ar:', d.get('company_name_ar'), '| decision:', d.get('decision'), '| confidence:', d.get('confidence_score'))
          print('market_segment/exchange fields present:', {k: d.get(k) for k in ('market', 'exchange') if k in d})
          "

      - name: Discover real symbols from the now-391-symbol rankings (multi-sector)
        id: symbols
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 30 -b /tmp/staff_cookies.txt \
            "$BACKEND_URL/api/v1/market/rankings" -o /tmp/rankings.json -w "\nHTTP %{http_code}\n"
          python3 -c "
          import json
          d = json.load(open('/tmp/rankings.json'))
          seen_sectors = {}
          for rl in d.get('rankings', []):
              for e in rl.get('entries', []):
                  sec = e.get('sector') or 'UNKNOWN'
                  sym = e.get('symbol')
                  if sym and sym not in ('1120', '7010', '2010', '2222', '9606') and sec not in seen_sectors:
                      seen_sectors[sec] = sym
                  if len(seen_sectors) >= 6:
                      break
          symbols = list(seen_sectors.values())[:5]
          print('New sector->symbol map (excluding the old 5-symbol sample):', seen_sectors)
          with open('/tmp/selected_symbols.json', 'w') as f:
              json.dump(symbols, f)
          "
          SYMS=$(python3 -c "import json; print(','.join(json.load(open('/tmp/selected_symbols.json'))))")
          echo "symbols=$SYMS" >> "$GITHUB_OUTPUT"
          echo "Selected: $SYMS"

      - name: Decision-v2 for newly-discovered symbols
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          SYMBOLS: ${{ steps.symbols.outputs.symbols }}
        run: |
          mkdir -p /tmp/decisions
          IFS=',' read -ra ARR <<< "$SYMBOLS"
          for SYM in "${ARR[@]}"; do
            [ -z "$SYM" ] && continue
            curl -sS --connect-timeout 10 --max-time 60 -b /tmp/staff_cookies.txt \
              "$BACKEND_URL/api/v1/stocks/$SYM/decision-v2" -o "/tmp/decisions/$SYM.json" -w "\nHTTP %{http_code}\n"
            python3 -c "
          import json
          try:
              d = json.load(open('/tmp/decisions/$SYM.json'))
          except Exception as e:
              print('$SYM: could not parse:', e); raise SystemExit(0)
          print('symbol:', d.get('symbol'), '| company_name_ar:', d.get('company_name_ar'), '| decision:', d.get('decision'), '| confidence:', d.get('confidence_score'), '| target1:', d.get('target_price_1'), '| stop_loss:', d.get('stop_loss'))
          c = d.get('committee')
          print('  committee:', 'present' if c else 'none', '-- final:', (c or {}).get('final_decision'))
          "
          done

      - name: Watchlist CRUD spot-check (add, list, remove) on the staff session
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          STAFF_CSRF=$(cat /tmp/.staff_csrf)
          echo "=== Add 2222 to watchlist ==="
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/staff_cookies.txt -o /tmp/watchlist_add.json -w "\nHTTP %{http_code}\n" \
            -X POST "$BACKEND_URL/api/v1/watchlist/items" -H "Content-Type: application/json" -H "x-csrf-token: $STAFF_CSRF" \
            -d '{"symbol": "2222"}'
          cat /tmp/watchlist_add.json; echo ""
          echo "=== List watchlist ==="
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/staff_cookies.txt -o /tmp/watchlist_list.json -w "\nHTTP %{http_code}\n" \
            "$BACKEND_URL/api/v1/watchlist"
          python3 -c "
          import json
          d = json.load(open('/tmp/watchlist_list.json'))
          items = d.get('items') if isinstance(d, dict) else d
          print('watchlist item count:', len(items) if isinstance(items, list) else 'n/a')
          print('contains 2222:', any((i.get('symbol') if isinstance(i, dict) else None) == '2222' for i in (items or [])) if isinstance(items, list) else 'n/a')
          "
          echo "=== Remove 2222 from watchlist ==="
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/staff_cookies.txt -o /tmp/watchlist_remove.json -w "\nHTTP %{http_code}\n" \
            -X DELETE "$BACKEND_URL/api/v1/watchlist/items/2222" -H "x-csrf-token: $STAFF_CSRF"
          cat /tmp/watchlist_remove.json; echo ""

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-scan-symbol-verify-evidence
          path: |
            /tmp/decision_9606.json
            /tmp/rankings.json
            /tmp/decisions/*.json
            /tmp/watchlist_add.json
            /tmp/watchlist_list.json
            /tmp/watchlist_remove.json
          retention-days: 14

      - name: Clean up local session artifacts
        if: always()
        run: rm -f /tmp/.staff_csrf /tmp/staff_cookies.txt /tmp/login_body.json
