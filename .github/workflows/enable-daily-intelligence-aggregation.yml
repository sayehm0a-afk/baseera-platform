name: Enable Daily Intelligence Aggregation Scheduler (temporary, one-shot)

# Fix 5 of the independent-audit remediation: GET /admin/ai-evolution/
# dashboard always 404'd because DailyIntelligenceAggregationScheduler
# is disabled by default (DAILY_INTELLIGENCE_AGGREGATION_SCHEDULER_ENABLED
# unset) and nothing else ever writes a DailyIntelligenceSnapshot row.
# aggregate_daily_intelligence() (src/ai_evolution/daily_intelligence_
# aggregation.py) handles zero real outcome rows gracefully -- it still
# writes/upserts a real (if all-zero) snapshot row -- and the scheduler's
# _loop() runs one cycle immediately on startup, before its first sleep,
# so enabling this flag and redeploying populates a real row right away.
# No external credentials needed (unlike SMTP), purely a feature flag
# this codebase's own operator already has full authority to set.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set DAILY_INTELLIGENCE_AGGREGATION_SCHEDULER_ENABLED=true
        run: railway variables --service "$RAILWAY_BACKEND_SERVICE" --set "DAILY_INTELLIGENCE_AGGREGATION_SCHEDULER_ENABLED=true"

      - name: Redeploy backend so it picks up the new variable
        run: railway up --service "$RAILWAY_BACKEND_SERVICE" --detach
