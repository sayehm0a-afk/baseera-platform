name: Check Production Readiness Accuracy Snapshot (temporary, one-shot, read-only, zero SAHMK cost)

# Launch-readiness assessment (2026-09-19): pulls the real, already-
# computed platform-wide accuracy/track-record numbers from production
# (win_rate, calibration_error, target/stop hit rates, paper-trade
# champion-vs-challenger comparison) so the go/no-go verdict is based
# on today's real evidence instead of the stale 2026-07-29 report.
# Every route hit here is a GET against already-persisted state --
# no mutation, no SAHMK call, no deployment.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Resolve backend public URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend_domains.json

      - name: Fetch real accuracy/track-record snapshot
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          python3 - <<'PYEOF'
          import os
          import requests

          backend_url = os.environ["BACKEND_URL"].rstrip("/")
          session = requests.Session()
          r = session.post(
              f"{backend_url}/api/v1/auth/login",
              json={"email": os.environ["STAFF_EMAIL"], "password": os.environ["STAFF_PASSWORD"]},
              timeout=30,
          )
          r.raise_for_status()
          csrf = session.cookies.get("csrf_token")
          if csrf:
              session.headers.update({"X-CSRF-Token": csrf})

          def show(label, path):
              print(f"=== {label} ===")
              resp = session.get(f"{backend_url}{path}", timeout=30)
              print(f"HTTP {resp.status_code}")
              try:
                  print(resp.json())
              except ValueError:
                  print(resp.text[:2000])
              print()

          show("admin/ai-evolution/dashboard", "/api/v1/admin/ai-evolution/dashboard")
          show(
              "admin/ai-evolution/personal-performance (30d)",
              "/api/v1/admin/ai-evolution/personal-performance?evaluation_horizon_days=30",
          )
          show("admin/ai-evolution/paper-trade-comparison", "/api/v1/admin/ai-evolution/paper-trade-comparison")
          PYEOF
