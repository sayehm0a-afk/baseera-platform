name: Diagnose Login Issue (temporary, evidence-only)

# Read-only diagnostic workflow -- makes zero application code
# changes. Exists solely to capture real HTTP evidence for a reported
# "OWNER account exists but browser login fails" issue: exact request/
# response for the login endpoint (as the browser would actually send
# it, with an Origin header), the real Set-Cookie attributes, whether
# CORS is actually configured on the live backend, whether the two
# Railway subdomains (frontend/backend) are registered as the same
# "site" per the real Public Suffix List (determines SameSite cookie
# behavior), and what backend URL is actually baked into the deployed
# frontend bundle. To be deleted once the root cause is confirmed.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BACKEND_SERVICE: backend
  RAILWAY_FRONTEND_SERVICE: frontend

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend/frontend public URLs
        id: urls
        run: |
          railway domain list --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_domains.json
          railway domain list --service "$RAILWAY_FRONTEND_SERVICE" --json > /tmp/frontend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          FRONTEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/frontend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          BACKEND_HOST=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print(d['domains'][0]['domain'])")
          FRONTEND_HOST=$(python3 -c "import json; d=json.load(open('/tmp/frontend_domains.json')); print(d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "backend_host=$BACKEND_HOST" >> "$GITHUB_OUTPUT"
          echo "frontend_host=$FRONTEND_HOST" >> "$GITHUB_OUTPUT"
          echo "Backend:  $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"

      - name: Confirm CORS_ALLOWED_ORIGINS as actually configured on the live backend
        run: |
          railway variables --service "$RAILWAY_BACKEND_SERVICE" --json > /tmp/backend_vars.json
          echo "=== CORS_ALLOWED_ORIGINS (as configured right now) ==="
          python3 -c "import json; d=json.load(open('/tmp/backend_vars.json')); print(d.get('CORS_ALLOWED_ORIGINS', '<NOT SET>'))"
          echo "=== FRONTEND_BASE_URL (as configured right now) ==="
          python3 -c "import json; d=json.load(open('/tmp/backend_vars.json')); print(d.get('FRONTEND_BASE_URL', '<NOT SET>'))"

      - name: CORS preflight (OPTIONS) for POST /api/v1/auth/login, exactly as a browser would send it
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: |
          echo "Origin header sent: $FRONTEND_URL"
          curl -sS -D - -o /dev/null --connect-timeout 10 --max-time 20 \
            -X OPTIONS "$BACKEND_URL/api/v1/auth/login" \
            -H "Origin: $FRONTEND_URL" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,x-csrf-token" \
            -w "\nHTTP %{http_code}\n"

      - name: POST /api/v1/auth/login with a real Origin header -- full response headers + body
        id: login
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: |
          echo "Exact URL called: $BACKEND_URL/api/v1/auth/login"
          echo "Origin header sent: $FRONTEND_URL"
          echo "=== Full response headers ==="
          curl -sS -D /tmp/login_headers.txt -o /tmp/login_body.json --connect-timeout 10 --max-time 20 \
            -c /tmp/cookies.txt \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Origin: $FRONTEND_URL" \
            -H "Content-Type: application/json" \
            -w "HTTP %{http_code}\n" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}"
          cat /tmp/login_headers.txt
          echo "=== JSON response body ==="
          python3 -m json.tool /tmp/login_body.json
          echo "=== Set-Cookie lines only (attributes, never the token value) ==="
          grep -i "^set-cookie:" /tmp/login_headers.txt | sed -E 's/=[^;]+/=<redacted>/'

      - name: GET /api/v1/auth/me using the session cookies just issued (proves backend-side JWT/session validity, isolated from browser cookie policy)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS -D - -o /tmp/me_body.json --connect-timeout 10 --max-time 20 \
            -b /tmp/cookies.txt \
            "$BACKEND_URL/api/v1/auth/me" \
            -w "\nHTTP %{http_code}\n"
          echo "=== JSON response body ==="
          python3 -m json.tool /tmp/me_body.json

      - name: Check whether the Public Suffix List treats backend/frontend Railway subdomains as the same "site"
        env:
          BACKEND_HOST: ${{ steps.urls.outputs.backend_host }}
          FRONTEND_HOST: ${{ steps.urls.outputs.frontend_host }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -o /tmp/psl.dat \
            "https://publicsuffix.org/list/public_suffix_list.dat"
          echo "Backend host:  $BACKEND_HOST"
          echo "Frontend host: $FRONTEND_HOST"
          echo "=== Relevant railway.app / up.railway.app entries in the real Public Suffix List ==="
          grep -n "railway\.app" /tmp/psl.dat || echo "(no railway.app entries found in the PSL)"
          python3 - "$BACKEND_HOST" "$FRONTEND_HOST" <<'PYEOF'
          import sys
          backend_host, frontend_host = sys.argv[1], sys.argv[2]
          with open("/tmp/psl.dat", encoding="utf-8") as f:
              rules = {
                  line.strip() for line in f
                  if line.strip() and not line.startswith("//")
              }

          def registrable_suffix(host: str) -> str:
              labels = host.split(".")
              for i in range(len(labels)):
                  candidate = ".".join(labels[i:])
                  if candidate in rules or f"*.{'.'.join(labels[i+1:])}" in rules:
                      return candidate
              return labels[-1]

          b_suffix = registrable_suffix(backend_host)
          f_suffix = registrable_suffix(frontend_host)
          print(f"Backend public suffix per PSL:  {b_suffix}")
          print(f"Frontend public suffix per PSL: {f_suffix}")
          print(f"Same registrable suffix (=> same SameSite 'site'): {b_suffix == f_suffix}")
          PYEOF

      - name: Fetch the deployed frontend HTML and locate its baked-in backend API URL
        env:
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -o /tmp/login_page.html -w "HTTP %{http_code}\n" "$FRONTEND_URL/login"
          echo "=== Script tags referenced by the login page ==="
          grep -oE 'src="[^"]*\.js"' /tmp/login_page.html | sort -u | head -20

      - name: Clean up local session artifacts
        if: always()
        run: |
          rm -f /tmp/cookies.txt /tmp/login_body.json /tmp/login_headers.txt /tmp/me_body.json /tmp/backend_vars.json
