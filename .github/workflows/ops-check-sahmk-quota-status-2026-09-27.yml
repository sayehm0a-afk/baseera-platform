name: Ops - Check real SAHMK quota status (zero-network-cost, read-only, 2026-09-27)

# CRITICAL Sunday finding: a live decision-v2 request just returned
# HTTP 503 "SAHMK daily request quota (100) already reached for today
# (UTC)" -- only ~2 hours after market open. This dispatches ONLY the
# zero-SAHMK-cost /admin/system/summary endpoint (explicitly documented
# in its own module as never calling get_market_data_provider() or any
# live SAHMK method) to see the real quota breakdown -- deliberately
# avoids any endpoint that would spend more of an already-exhausted
# 100-request daily budget. Never modifies anything, never touches
# SAHMK itself.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve backend URL
        id: urls
        run: |
          railway domain list --service backend --json > /tmp/backend_domains.json
          BACKEND_URL=$(python3 -c "import json; d=json.load(open('/tmp/backend_domains.json')); print('https://' + d['domains'][0]['domain'])")
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Log in as staff
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -c /tmp/cookies.txt -o /tmp/login_body.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_EMAIL']))"), \"password\": $(python3 -c "import json,os; print(json.dumps(os.environ['STAFF_PASSWORD']))")}")
          echo "Login HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then echo "::error::login failed"; exit 1; fi

      - name: Real admin/system/summary (zero SAHMK network cost by design)
        env:
          BACKEND_URL: ${{ steps.urls.outputs.backend_url }}
        run: |
          curl -sS --connect-timeout 10 --max-time 20 -b /tmp/cookies.txt \
            "$BACKEND_URL/api/v1/admin/system/summary" -o /tmp/summary.json -w "\nHTTP %{http_code}\n"
          python3 -c "
          import json
          d = json.load(open('/tmp/summary.json'))
          for k in sorted(d.keys()):
              if 'sahmk' in k.lower() or 'quota' in k.lower() or 'market_data' in k.lower() or 'scan' in k.lower() or 'ingestion' in k.lower():
                  print(f'{k}: {d[k]}')
          "

      - name: Security check -- grep captured responses for secret-leak patterns
        if: always()
        run: |
          PATTERN='sk-[A-Za-z0-9]{10,}|RAILWAY_TOKEN|SAHMK_API_KEY|postgres:\/\/[^"]*:[^"]*@|SECRET_KEY|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          FOUND=0
          for f in /tmp/*.json; do
            [ -f "$f" ] || continue
            if grep -qE "$PATTERN" "$f"; then
              echo "::error::Potential secret-leak pattern found in $f"
              FOUND=1
            fi
          done
          if [ "$FOUND" != "0" ]; then exit 1; fi
          echo "No secret-leak patterns found."
